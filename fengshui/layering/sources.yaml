# D 组 · 城址／相土 —— **没有现成规则集，是最大的空白**
# ══════════════════════════════════════════════════════════
城址相土:
  - 书: 管氏地理指蒙
    成书: 托三国·管辂／实唐宋
    dating_disputed: true
    相关篇目: 相土度地第四、三奇第五、四镇十坐第六、开明堂第十一、
              形势异相第十五、朝从异相第十六、四势三形第十八、远势近形第十九
    入库: masters/corpus/gjtsjc/655-659.txt
    本项目用到: 无
    注意: |
      样本中「城 355 + 遗址 538」= 893 处属城址聚落类，占 20.5%，
      而本项目**没有任何一条规则是为这一类抽的**。
      这一支是补齐对象层最该先做的。
  - 参: 周礼·考工记「匠人营国」
    对象: 都城规制（方九里、旁三门、左祖右社）
    性质: 礼制规范，非风水判据 —— 但它是都城选址与布局的实际约束，
          且与形势派判据可能冲突。评价都城时若不计入，等于漏掉主要变量

# ══════════════════════════════════════════════════════════
# E 组 · 批判文献 —— 用于自我校准，不作判据
# ══════════════════════════════════════════════════════════
批判:
  入库: masters/corpus/yiwen.txt（1.86 万字，整卷）
  篇目:
    - 嵇康《難宅無吉凶攝生論》及答論（晋）
    - 呂才《五行祿命葬書論》（唐约640）—— 用《春秋》做基率检验，方法与本项目同类
    - 趙汸《葬書問對》《風水選擇序》（元）
    - 胡翰《風水問答序》、羅虞臣《辨惑論》、項喬《風水辨》（明）
  用途: |
    这些是这门学问自身的内部批判线。本项目做的不是外部祛魅，是这条线的延续。
    吕才的做法（先说清规则预言什么，再去数历史样本）应作为验证流程的范式。
