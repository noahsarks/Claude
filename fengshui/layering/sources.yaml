# 古籍分类表：按对象、时代、流派、尺度、语式给每部文献定位
#
# 「成书年代」一栏：托名者以「托X·某人／实Y」标注。
#   术数文献托名严重（托郭璞、托杨筠松、托黄妙应者尤多），
#   传统署名不能当成书年代用。凡有争议者标 `dating_disputed: true`。
# 「语式」：判定式=描述已有之地如何；祈使式=指示应当如何布置。二者数学方向相反。

说明:
  用途: 前置判定层据此选规则子集。对象或年代不匹配则该条不参与计算，而非降权。
  当前状态: |
    本项目现有 16 条规则全部出自「对象=阴宅」的文献（见下表 A 组），
    而验证样本 89.5% 非阴宅。这是本次审计发现的最严重问题。

# ══════════════════════════════════════════════════════════
# A 组 · 阴宅形势文献 —— 现有 16 条规则的全部出处
# ══════════════════════════════════════════════════════════
阴宅形势:
  - 书: 葬经（葬书）
    成书: 托晋·郭璞／实唐宋间
    dating_disputed: true
    对象: 阴宅
    流派: 形势
    尺度: 势(千尺≈300m)／形(百尺≈30m)，原文明言
    语式: 混（「乘生气」是原理，「五不葬」是判定式）
    本项目用到: R8_zangfeng、F_四势反、F_过山、F_独山
    入库: masters/corpus/gjtsjc/655.txt（青烏先生葬經）；另有四庫本
  - 书: 葬经翼
    成书: 明·缪希雍（1546–1627），约万历间
    对象: 阴宅
    流派: 形势
    尺度: 穴级为主（穴病、倒杖十二法）
    语式: 判定式（「穴病」是对已有之地的诊断）
    本项目用到: R1 R2 R3 F1 F2 F3 F4 F6 F7 —— **占全部规则的一半**
    入库: masters/corpus/gjtsjc/670.txt
    注意: 这是主体来源，而它是**明代**的、**阴宅**的、**穴级**的
  - 书: 博山篇
    成书: 托唐·黄妙应／实宋元以后
    dating_disputed: true
    对象: 阴宅
    流派: 形势
    尺度: 龙→穴，跨势与形
    语式: 混
    本项目用到: R4_mingtang R5_ancase_chaoshan R6_deshui R9_longmai
  - 书: 雪心赋
    成书: 托唐·卜则巍／宋元有注本
    dating_disputed: true
    对象: 阴宅为主
    流派: 形势
    语式: 混
    本项目用到: R7_shuikou_guansuo、F5_fantiao
  - 书: 撼龙经／疑龙经
    成书: 托唐末·杨筠松
    dating_disputed: true
    对象: 阴宅（寻龙）
    流派: 形势
    尺度: 势级（山脉走向，十公里量级）
    入库: masters/corpus/gjtsjc/660-669.txt
    本项目用到: 无（应补——现有规则缺「龙」这一层的实质内容）
  - 书: 发微论
    成书: 宋·蔡元定（1135–1198）
    dating_disputed: false
    对象: 阴宅
    流派: 形势（理论性，非操作性）
    本项目用到: 引作 R3 的旁证
  - 书: 水龙经
    成书: 明末清初，托名
    对象: '**平洋阴宅**（无山地区，以水代山）'
    流派: 形势
    尺度: 水系级
    入库: masters/corpus/gjtsjc/671-674.txt
    本项目用到: 无
    注意: 平原样本（洛阳盆地、关中）本应用这一支而非山地诸经，**这是一个明确的缺口**

