# C 组 · 理气文献 —— 引擎不实现，但已用于 citycase 与挨星核验
# ══════════════════════════════════════════════════════════
理气:
  - 书: 沈氏玄空学（含章仲山宅斷）
    成书: 原著清嘉道（1813–1838）；沈注 1900 前后；刊行 1927
    对象: 阴宅五十四条 + 阳宅十七条，**分列不混**
    流派: 玄空·无常派
    尺度: 宅级；且原文自设「分房各以私门立极」
    语式: 判定式（逐案断验）
    入库: masters/corpus/shen/（68 篇）
    本项目用到: 挨星实现的回归基准（下卦 6/6 一致）；citycase 出盘
    时代约束: |
      **三元九运飞星是清代系统化的。** 用它评明代及更早的建筑是倒推。
      citycase 用八运评 1999–2016 年建成的楼，时代匹配；
      若用于明十三陵（1409）则不匹配。
  - 法: 五音姓利
    行用: 隋唐至北宋官方
    对象: 阴宅（北宋皇陵）+ 阳宅
    输入: '**姓氏声韵**，与地形无关'
    状态: '**唐·吕才（约 640）已以内部不自洽证伪**（见 masters/cases/A10）'
    影响: 巩义宋陵朝向由此定，与形势通则相反（A05）；该批遗址在我们的晋南豫北样本内

