# 前置判定层设计草案
# 分析开始前先答四问；答不上来就输出「不判」并列出缺什么，不往下算。

前置四问:
  Q1_对象类型:
    取值: [阴宅, 阳宅, 聚落城址, 寺观, 工业设施, 未知]
    决定: 用哪一组规则（见 sources.yaml 的 A/B/D 组）
    现状: 引擎只有 A 组（阴宅）规则；B 组文献已入库未用；D 组无规则
  Q2_营建年代:
    取值: 年份或年代区间
    决定: 可用文献的时代窗口 + 数据可靠性
    现状: guobao.json 无年代字段 —— **必须先补**
  Q3_立极单位:
    取值: [一穴, 一宅, 一房, 一院, 一聚落, 一城]
    决定: 分析尺度区间
    依据: B01《阳宅秘断》会稽章宅「一到分房宅气移」；王则先「余屋各自立极」
  Q4_分析目的:
    取值: [择址（前瞻）, 断验（回溯）]
    决定: 祈使式规则是否可用
    理由: 「宜见水」是处方，「有水」是诊断。用处方解释已建成的遗址即倒果为因

规则筛选:
  过程: |
    对象 ∈ 规则.对象         → 否则该规则不参与（不是降权，是不参与）
    营建年代 ≥ 文献成书年代   → 否则不参与（唐代建筑不用明代书）
    立极尺度 ∈ 规则.尺度区间  → 否则不参与
    目的 = 断验 且 规则.语式 = 祈使 → 不参与
  输出: 参与的规则清单 + 每条被排除者的排除理由（可逐条复核）

数据可靠性检查:
  水系时代性:
    触发: 营建年代早于约公元 1 世纪，且位于黄河/洛河/渭河下游冲积区
    依据: 实测——二里头/偃师商城/东周王城 距今水系 2.4-2.6 km 且汇水 0.0 km²，
          而汉魏故城/隋唐洛阳城 309-493 m 且汇水 2.3-2.7 km²
    处理: water 与 water_gate 标记为不可靠，不参与打分（平原模式下这是 48% 的权重）
    复现: python3 water_anachronism.py
  坐标系:
    触发: 坐标来源不明或疑似国内地图
    风险: GCJ-02 相对 WGS84 偏移 300-600 m，正落在本引擎位移噪声的敏感区
    处理: guobao.json 尚未核查，须核
  尺度匹配:
    规则: 对象允许尺度 ∩ 数据分辨率 = ∅ 时拒绝出分
    实例: citycase 中上海中心与金茂相距 182 m，30 m DEM 上是同一片地形，
          算出的 Δ=0.010 小于该地 ±1km 位移 SD 0.023-0.028，不可解读

输出契约:
  必须包含:
    - 四问的答案（含「未知」）
    - 参与计算的规则清单
    - 被排除的规则及排除理由
    - 触发的数据可靠性告警
    - 每条参与规则的中间量（度数、距离、仰角、比值），可逐条复核
  禁止:
    - 在 Q1-Q4 有「未知」时输出综合分数
    - 输出一个没有中间量的裸数字（C03「能量值 36000 分」是反面标本）

实施顺序:
  1: 给 guobao.json 补年代与对象类型字段（无此则轴 1、轴 2 都无法执行）
  2: 正样本按对象分层，各层单独重算增益 —— 这是检验「对象混用是否是主因」的直接实验
  3: 对早期遗址关闭 water/water_gate，看效应量变化
  4: 从《阳宅十书》抽阳宅规则集；从《管氏地理指蒙》抽城址规则集
  5: 每条规则补 era_valid / 对象 / 尺度区间 / 语式 四个字段
