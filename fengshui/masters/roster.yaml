# 二、形势派 / 江西杨公一系（与本项目地形引擎直接对口的一支）
# ══════════════════════════════════════════════════════════════

三僚_曾廖二姓:
  地: 江西兴国县梅窖镇三僚村
  传承: 托始于唐末杨筠松授曾文辿、廖瑀；曾廖两姓世代业此至今
  方法论核心: 龙穴砂水向五诀，以踏勘山形水势为主，理气为辅
  与本项目的关系: "**这是唯一以地形为主要判据的活传承**"
  evidence: A（村落与族谱实体存在，有民族志与地方志记载）
  问题: |
    三僚现已高度旅游化与培训班化，当代「传人」的资质与谱系难以核验；
    其对外发布的案例几乎全为宣传性质（D 级）。
    真正可用的是学术界对该村的田野调查，而非从业者自述。
  人物:
    - 名: 曾子南
      生卒: 1907–2006（生于江西赣州，1966 年于台湾创办中国堪舆学会，卒于台北）
      地: 江西赣州 → 台湾
      著: 《三元地理择日讲义》(1967)《香港风水漫谈》(1981)《堪舆实证》等，号称百册
      方法论: |
        三元地理（易盘玄空，以六十四卦立向而非二十四山）。
        自述「结合科学，讲求辩证，破除风水迷信」，是本名录中最早明确把
        「破除迷信」写进纲领的从业者。
      客户: 王永庆、陈履安、谢春木、许胜雄等家族（C 级，来自门人记述）
      evidence: B（著作存世）／案例 C
      案例: C05（梨山合陵，见 cases/）

