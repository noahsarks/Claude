# 三、港澳台商业化一代（1950s– ）
# ══════════════════════════════════════════════════════════════

香港:
  背景: |
    1949 年后大量堪舆从业者南下香港，加上英治时期无「破除迷信」政策，
    香港成为二十世纪风水实践的主要延续地。其市场结构与内地完全不同：
    与地产、金融、演艺业深度绑定，形成「名人风水师」这一现代职业形态。
  人物:
    - 名: 蔡伯励
      生卒: 1922–2018
      地: 广东顺德 → 香港（真步堂第三代）
      家世: 祖父蔡最白（C 级说法：晚清钦天监监正——此说需档案核验，存疑）
      方法论: |
        以历算为本：编纂《通胜》历书（真步堂天文历算），择日为主业，堪舆为辅。
        **本名录中方法论最可核验的一位**——历算部分对错分明。
      案例: C02（霍英东墓地，2006）、C03（林百欣潮阳择穴）
      evidence: B（《通胜》存世且可逐年核算）／案例 C
    - 名: 陈朗
      生卒: 1936–2018（祖籍四川）
      师承: C 级说法：从溥心畬研易
      客户: C 级说法：李嘉诚及演艺界，长期
      方法论: 记述含糊，无著述留下可核验的规则
      evidence: C
    - 名: 白鹤鸣
      著: 自称编写风水玄学书籍 111 部（全球玄学著作最多）
      方法论: 面向大众的通俗玄空 + 化煞法器
      evidence: B（著作确实存世且量大）／案例 D
    - 名: 宋韶光
      方法论: 通俗玄空，电视与出版为主
      evidence: B（著作存世）／案例 D
    - 名: 林国雄
      evidence: C
    - 名: 麦玲玲
      方法论: 生肖运程年历为主，风水为辅；高度商品化
      evidence: D（就案例而言）

台湾:
  人物:
    - 名: 钟义明
      生: 1949-06-22，南投竹山，台师大美术系
      著: 对《地理辨正疏》《天玉经》《沈氏玄空学》的系统注释与跨派比较
      方法论: |
        以整理、注释、跨流派比对为主，非以接案为主。
        **是本名录中最接近「文献学者」的从业者**，其跨派比较对我们做规则差异分析有直接用处。
      evidence: B

