# 近二百年风水师名录（1826–2026）
# evidence: A 第三方独立记录 / B 本人著述存世 / C 媒体传记转述 / D 无出处（只登记不采信）
# 「方法论」一栏只记该人实际据以下断的东西，不记其自我标榜。

说明:
  时间范围: 1826-2026（自本目录编成之年上溯二百年）
  收录标准: 有姓名、有可查的著述或可查的事件；纯排行榜人物入 D 级备查区
  重要提醒: |
    条目中的「生卒」若无括注出处，为中文二手资料通行说法，未经档案核验。
    术数界的师承叙述普遍有攀附倾向（上溯郭璞、杨筠松者尤甚），
    凡宋以前的传承链一律视为教派谱系而非史实。

# ══════════════════════════════════════════════════════════════
# 一、玄空理气诸派（本时段的学术主流）
# ══════════════════════════════════════════════════════════════

无常派:
  地域: 江苏无锡、常州
  取名: 发源无锡弘扬常州，故称「无常」；亦取「玄空变换无常」之义
  方法论核心: 三元九运 + 二十四山 + 挨星顺逆 → 山向飞星 → 宫位断吉凶
  与地形的关系: 峦头只作「体」，判断由理气盘决定；砂水是盘的验证物，不是输入
  人物:
    - 名: 章仲山
      字号: 名甫，字仲山，号无心道人，斋号千墨庵
      生卒: 清嘉庆道光间（约 1765–1850s，确切年份存疑）
      地: 江苏无锡
      著: 《地理辨正直解》《临穴指南》《天元五歌阐义》《心眼指要》《玄空秘旨批注》
          《阴阳二宅录验》（又名《二宅玄机》，阴宅篇 1813，阳宅篇 1813–1838）
      方法论: |
        以挨星诀为骨。《阴阳二宅录验》逐案记录：坐向兼线 + 元运 + 门路水口形势
        + 飞星盘 + 断语 + 应验。这是本时段**唯一成规模的逐案记录体**。
      evidence: B
      案例: 见 cases/index.yaml，B01–B0n（条目已录，原文本次未取得）
      备注: 「蒋大鸿之后治玄空地理卓然有成之第一人」为门内评语，非独立评价

    - 名: 沈竹礽
      本名: 沈绍勋（1849–1906，archive.org 藏《增广沈氏玄空学》著录为 Shen, Zhureng, 1849-1906）
      地: 浙江钱塘
      著: 《沈氏玄空学》（身后由其子沈祖绵、王则先等编定刊行）
      方法论: |
        破章氏之秘：以自研挨星法反推章仲山《宅断》诸案，逐案作注。
        **本时段最重要的一次「公开验证」尝试**——用一套公开规则去复算别人的私秘案例集。
        其体例与本项目做的事同构（拿规则去撞既有案例），值得单独研究。
      evidence: B
      影响: 玄空由秘传转公开自此始；今日绝大多数排盘软件用的都是「沈氏挨星」

    - 名: 王则先
      时代: 民国
      著: 编订《沈氏玄空学》《地理疑义答问》《玄空古义四种通释》《玄空捷诀》
      方法论: 编纂整理，非独立术者
      evidence: B

    - 名: 杨九如
      时代: 民国
      地: 上海
      方法论: 章仲山亲族后人，无常派直系；民国间于上海公开授徒
      evidence: C
      备注: 生卒不详；此条依赖二手传承叙述

    - 名: 尹一勺
      著: 《四秘全书》
      evidence: C
    - 名: 华湛恩
      evidence: C
    - 名: 温明远
      著: 《辨正续解》
      evidence: C
    - 名: 申听禅
      字号: 一名生记，垂生子
      evidence: C

广东派_又称闽南派:
  方法论核心: 峦头（形势）+ 三元玄空理气 + 奇门 + 六壬 + 通书择日，四术合参
  人物:
    - 名: 蔡岷山
      本名: 名本江，号东瑚散人
      地: 广东澄海东湖乡
      著: 《地理辨正求真》《家传衍义》
      方法论: 其《辨正求真》所解「二十五法」被认为泄前人之伪
      evidence: B
    - 名: 蔡书云
      字: 麟士（蔡岷山子）
      著: 《峦头心法图诀》
      方法论: "**本名录中少数以峦头为主标题著书者**"
      evidence: B
    - 名: 吴师青
      生卒: 1893–1980
      地: 广东→香港
      著: 《地学铁骨秘》《天体历》《中国七政四余星图析义》
      方法论: |
        玄空 + 七政四余（真实天文历算）。其《天体历》是实际可用的天文星历，
        属本名录中**唯一把可核验的天文计算纳入术法**的一支。
      evidence: B
    - 名: 孔昭苏
      生卒: 1902–1979
      著: 《孔氏玄空宝鉴》《中国心易》《择日学讲义》
      方法论: 玄空 + 择日；自立孔氏一门
      evidence: B
    - 名: 刘礼让
      著: 《三元地理一脉真传》
      evidence: C
    - 名: 王亭之
      本名: 谈锡永（1935– ）
      地: 广州→香港→加拿大
      著: 《中州派玄空学》
      方法论: |
        自称受中州派秘传。中州派与沈氏挨星在若干运的顺逆判定上有分歧，
        是**现存少数可以互相证伪的门派差异**之一（可用我们的 216 局表逐条比对）。
      evidence: B

玄空六法_谈氏:
  人物:
    - 名: 谈养吾
      本名: 谈浩然，号索性居士（1890–1970s）
      地: 江苏武进
      师: 十九岁从杨九如学飞星玄空，后自变其说
      著: 《辨正新解》《大玄空实验》《大玄空路透》《玄空本义》
      方法论: |
        中年弃飞星，改宗「二元八运」与玄空六法（玄空大卦、雌雄、金龙、挨星、城门、太岁）。
        **《大玄空实验》以「实验」名书，是本时段第二部成规模的案例集。**
      evidence: B
      重要性: 他公开否定自己前半生所学，是本领域罕见的自我证伪记录

其他玄空诸派:
  滇南派: {宗师: 范宜宾, evidence: C}
  苏州派: {宗师: 朱小鹤, evidence: C}
  上虞派: {宗师: 徐迪惠, evidence: C}
  湘楚派: {宗师: 尹一勺, evidence: C}

