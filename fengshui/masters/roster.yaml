# 五、D 级备查区（只登记存在，不进案例库）
# ══════════════════════════════════════════════════════════════

D级备查:
  说明: |
    以下人物大量出现在「中国十大风水大师排名」「综合影响力 TOP10」类内容中。
    这类内容普遍为付费收录或自媒体拼凑，同一榜单不同年份人物几乎全换，
    且几乎全部无著述、无可查事件、无第三方记述。
    **本目录登记其存在，作为市场结构的证据，但不采信任何具体案例。**
  观察到的市场结构:
    - 榜单类内容构成中文风水语料的绝大多数
    - 「培训班出身（数周课程）→ 自称大师 → 上榜 → 招生」是当前主要供给链路
    - 与 Ren 的田野结论一致：传统师承术者极少，培训班出身者构成主体
