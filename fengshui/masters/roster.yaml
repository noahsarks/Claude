# 四、学院派（研究者，不接案，但产出唯一的 A 级材料）
# ══════════════════════════════════════════════════════════════

学院派:
  说明: |
    这一栏不是「风水师」，但**本目录 A 级案例几乎全部来自这里**。
    他们与术者的根本差别：观察者与被观察者分离，记述可被第三方复核。
  人物:
    - 名: 王其亨
      机构: 天津大学建筑学院
      工作: 明清皇家陵寝大规模测绘、样式雷图档研究；主编《风水理论研究》(1992/2005)
      方法论: 建筑测绘 + 档案（样式雷图档）+ 现场踏勘，反推古人选址的实际依据
      对本项目的价值: 唯一有实测数据支撑的古代选址研究
      evidence: A
    - 名: 于希贤
      机构: 北京大学
      工作: 历史地理学角度的风水研究
      evidence: A
    - 名: 何晓昕
      著: 《风水史》
      evidence: A
    - 名: 尹弘基 (Hong-key Yoon)
      机构: University of Auckland
      著: The Culture of Fengshui in Korea; Geomantic Relationships between Culture and Nature
      evidence: A
    - 名: Stephan Feuchtwang
      著: An Anthropological Analysis of Chinese Geomancy (1974)
      对本项目的价值: 尚未读。是本领域最早的结构人类学分析，架构重构前应先读
      evidence: A
    - 名: Ole Bruun
      著: "Fengshui in China: Geomantic Divination between State Orthodoxy and Popular Religion"
      evidence: A
    - 名: Ren, Youcao (任友草)
      机构: University of Sheffield（建筑学院）
      著: "Feng Shui: Changing Rules and Meanings (PhD thesis)"
      田野: 2014–2017，浙江武义/金华、河南、杭州
      对本项目的价值: |
        **本目录 A 级案例的唯一来源。** 其第五章逐日记录了两位术者的完整作业过程，
        包括工具、步骤、判据、与客户的交涉，细到「尺长 0.32 m，量了 8 次，退 2.4 m」。
        这种颗粒度在全部中文材料里没有第二份。
      evidence: A

