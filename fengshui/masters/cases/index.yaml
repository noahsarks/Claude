  - id: B01
    file: B01-沈氏玄空学-阳宅秘断.md
    master: 章仲山（原著）/ 沈竹礽（注）/ 王则先（则先谨按）
    date: 1813-1838（原著）；1900s-1927（注与刊行）
    evidence: B
    text_retrieved: true
    corpus: ../corpus/shen/*.txt（三篇 2.8 万字，全部 17 条）
    source: 新浪博客「山水清澈」逐条转录；沿「前一篇」链回溯抓取
    copyright: 章仲山/沈竹礽/王则先 均逝世逾五十年，原文与三家按语为公有领域
    regression_test:
      method: 用已验证的 216 局挨星实现复算，与原文可判读的盘面语比对
      result: 下卦 6/6 一致（陶姓宅旺山旺向、会稽任宅与章宅与张村丁宅双星到坐、胡宅上山下水、申寅双星到向）
      excluded: 两条替卦案（原文自书「此局用变卦」），本实现只做下卦
      script: ../corpus/regress_qing.py
      meaning: |
        挨星这一层现在有四个独立端点互证：沈氏标准表 ↔ fscalc(2010s) ↔ Horosa(2020s) ↔ 章仲山原案(1810s-30s)。
        可当作已解决问题。但它一点也没说明风水有效——只说明同一套确定性算法被正确实现了两次。
    structure: |
      每条断语都由飞星盘发动，形势只作「凑合」项。王则先：「玄空五行之吉凶，
      必与实地形峦相凑合，其验乃神……苟无路气直冲，甚验亦微」——
      理气定性质，形势定强度，二者是乘性关系。
      这是引擎 v0.2 势/形乘性结构的第二个依据（第一个是《葬经》）。
    terrain_items_computable: 只有「某方有水」与「高低遮蔽」两类；破屋、暗探、大树、屋内阴暗、路，均不可算
    testable_by_us: partial
    reason: 挨星层已测通过；形势层不可测——全部为阳宅，尺度是院落与邻屋（十米量级），DEM 最细 800m
    yield: |
      清代逐案记录体的主体是阳宅，而地形分析属于阴宅——与 analysis.md「地形只在阴宅是核心」第三次吻合。
      仍要拿的是《阴宅秘断》五十四条，那才是与地形引擎对口的部分。

  - id: B02
    file: B02-沈氏玄空学-阴宅秘断.md
    master: 章仲山（原著）/ 沈竹礽（详注）/ 王则先（补阐）
    date: 1813（原著）
    evidence: B
    text_retrieved: true
    corpus: ../corpus/shen/*.txt 八篇约 3.6 万字；解析出 21 案 → ../corpus/yinzhai_parsed.json
    体例: 来龙走向 + 入首方位 + 结穴形态 + 各方水情 + 坐向 + 元运 + 断语 + 应验 + 三家按语
    test_1_挨星回归: 通过。连同 B01 共 27 案，挨星层四端点互证（沈氏表/fscalc/Horosa/章仲山原案）
    test_2_内部一致性:
      script: ../corpus/consistency_test.py
      result: |
        旺山旺向  n=4   正2 平0 负2  均值 +0.00
        双星      n=10  正3 平2 负5  均值 -0.20
        上山下水  n=7   正0 平0 负7  均值 -1.00
        Spearman rho=+0.460 p=0.036；旺山旺向 vs 上山下水 Mann-Whitney 单尾 p=0.034
      不是什么: 不是预测效度检验。作者写断语时盘已排好，一致是构造上就该发生的
      是什么: 测「即使作者可以让它对得上，它有多对得上」
      结果形状: |
        一头准一头不准——上山下水断语必负 7/7 无例外；旺山旺向只有一半正 2/4。
        这个不对称才是结论：在作者本可让它完美自洽的语料里，最吉的格局有一半记着坏结果。
      那一半怎么解释的: |
        修正项全部是形势——「乾兑两宫有水」「坎方有河冲腰」「峰歪」「局势宏敞」「水光圆朗」「龙真穴的」。
        王则先：「玄空五行之吉凶，必与实地形峦相凑合，其验乃神……苟无路气直冲，甚验亦微。」
      推论: |
        按这批案例自己的记录，理气不足以解释结果，未解释的方差全被记在形势上。
        这是本项目第一个支持地形层的论证，且来自传统内部——
        出自理气派最权威的案例集，用理气派自己的失败案例说出来。
    testable_by_us: false
    reason: 21 案中只有 3 案有可定位地名（柳塘桥、钱塘、青城桥），且均为村/桥级，落不到穴位
    反差: 21/21 都有完整峦头描述。描述全有，坐标全无
    唯一例外: 「无锡石塘湾孙姓祖墓，子山午向，二运扦」——石塘湾为今无锡惠山区实地名，定位精度最高
    与A06对照: |
      A06 有坐标 + 可计算判据 + 否定样本，但判据只四条；本批判据丰富但全缺坐标。
      两者合起来即这条路的天花板：判据与坐标在历史文献里几乎从不同时出现。

