  - id: A06
    file: A06-牛头山之争-北宋永定陵.md
    master: 徐仁旺（另有吳景鸞就同一处上奏）
    date: 约 1022（宋真宗崩后营永定陵）
    place: 河南鞏義宋陵牛頭山
    coords_known: true
    evidence: A
    source: 《廣信府志》《江西通志》→《古今圖書集成·堪輿部》卷679
    decision_driver: 政治（丁謂为山陵使，术者意见被否决，吳景鸞因言下狱）
    terrain_used: 决定性（术者一方）
    candidates: 牛頭山前地 vs 山後地（二选一，位置明确）
    claims:
      - "坤水長流，災在丙午歲內；丁風直射，禍當丁未年中（徐仁旺）"
      - "坤風側射，厄當國母離宮；坎水直流，禍應至尊下殿（吳景鸞）"
    testable_by_us: true
    maps_to_component: [water, zangfeng]
    caveat: 应验部分隔一百零四年，是事后追记；干支六十年一轮，命中不含信息量
    yield: "本目录唯一有否定样本的可测案例。把引擎从「这块地几分」变成「A 处坤方水是否强于 B 处」——有确定答案的比较问题"

