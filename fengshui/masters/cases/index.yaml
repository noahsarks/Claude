  - id: A09
    file: A09-管辂-毋丘俭墓.md
    master: 管輅（209-256）
    date: 约 255 前
    place: 毋丘儉墓（位置无定论）
    coords_known: false
    evidence: A
    source: 《三國志·魏志·管輅傳》→《古今圖書集成·堪輿部》卷680 紀事
    decision_driver: 纯地形
    claims: "元武藏頭，蒼龍無足，白虎銜尸，朱雀悲哭，四危以備，法當滅族"
    testable_by_us: false
    reason: 墓址无法定位
    yield: |
      ① 凶格是门槛式的（四项同时成立才断），不是加权求和——与引擎现行结构不等价
      ② 「白虎銜尸」「朱雀悲哭」判的是形态与声音，不是有无与高低，这一层我们算不出
      ③ 同卷郭璞「葬龍角/葬龍耳」一条：同一处地形因命名不同而结论相反，
         是「1km 位移噪声≈效应量」的古典版本

  - id: A10
    file: A10-吕才-唐代基率检验.md
    master: 呂才（600-665，唐太宗命其刊定阴阳书）
    date: 约 640（貞觀）
    evidence: A
    source: 《五行祿命葬書論》→《古今圖書集成·堪輿部》卷680 藝文
    type: 方法论案例（非选址案例）
    method: |
      对五姓：无出处 + 姓氏后起无从配属 + 内部不自洽（陳同为水姓与火姓）
      对择日：「今檢葬書，以己亥之日用葬最凶。謹按春秋之際，此日葬者凡有二十餘件，
              此則葬不擇日」——拿可数的历史样本看规则预言的分布是否出现，即基率检验
    testable_by_us: 不适用
    yield: |
      ① 「拿历史样本检验风水规则」不是现代的也不是外来的，在中国有 1400 年内部传统
      ② 决定北宋皇陵朝向的五音姓利，在被用于皇陵之前四百年就已被唐代官方否定
      ③ 呂才先说清规则预言什么再去数；我们在洛阳是先跑格网看到 +0.564 才去解释，顺序是反的。
         关中复核（预先声明参数、不重新调参）才是对的流程，应固定

