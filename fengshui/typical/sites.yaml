    lat: 40.2955
    lon: 116.2350
    坐: 0
    坐向依据: 神道—陵门—祾恩殿—宝城南北中轴；廖均卿相地（《江西通志》，见 masters/cases/A07）
    可测: true

  - id: T5
    name: 北宋永定陵
    对象: 古墓葬
    年代: 1022
    lat: 34.7480
    lon: 112.9720
    坐: 135
    坐向依据: |
      五音姓利——赵姓属角音，利壬丙，故北宋皇陵一律「东南地穹、西北地垂」，
      即头枕东南、足抵西北，与形势派通则相反（见 masters/cases/A05）。
      本点是检验「规则与择址范式不匹配」的对照点。
    可测: true
    注意: 该点预期得低分，且这是**正确**的——它本就不按形势派定向

