# 典型建筑验证集 —— 少而准，每条坐向必须有据
#
# 收录标准：① 坐标可核 ② **坐向有据**（考古报告/实测/门牌临街面），不推断
#            ③ 对象类型与年代确定 ④ DEM 瓦片已在库
# 「坐向依据」一栏若为「无据」则该点只作对照，不参与需要坐向的判据。

说明:
  坐: theta_back，即坐山方位角（度，真北系）
  向: 坐 + 180
  为什么必须有据: |
    masters/analysis.md 结论三：坐向来自生辰或规制，不来自地形，四案一致零案反例。
    v0.7 新增的明堂水项以「穴前」为界，坐向未知时该项返回「不判」而非 0 分。

sites:
  - id: T1
    name: 汉魏洛阳故城
    对象: 城址
    年代: 东汉—北魏（25–534）
    lat: 34.7256
    lon: 112.5747
    坐: 0
    坐向依据: 中国古代都城通制坐北朝南；宫城—铜驼街—宣阳门为南北中轴（考古实测轴线近正南北）
    可测: true

