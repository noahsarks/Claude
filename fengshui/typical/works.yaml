# 《欽定古今圖書集成·博物彙編·藝術典·堪輿部》651–680 卷所收全部文献编目
#
# 每条给四个字段，其中「年代可靠性」是本表的要点：
#   题署        —— 书上写的作者
#   实际年代    —— 学界通行的成书判断（附理由）
#   年代可靠性  —— 确定 / 大致 / 存疑 / 托名
#   性质        —— 技术 / 批判 / 传记
#
# 立这张表的原因：术数文献托名极重，按题署排序会得出「东汉已有完整体系、
# 后世只是注解」的错误图景。要做编年，必须先把题署与成书分开。

说明:
  底本: 清康熙末编、雍正四年（1726）刊殿本，维基文库校对文本
  入库: masters/corpus/gjtsjc/651-680.txt
  本表用途: CHRONOLOGY.md 的排序依据；MODERN_RULES.yaml 每条规则的 era 字段来源

works:
  - 卷: [651, 652, 653, 654]
    书: 九天元女青囊海角經
    题署: 九天玄女（神话人物）
    实际年代: 宋元（约 12–14 世纪）
    年代可靠性: 托名
    理由: 题署为神话人物，非人。文内引「宋當開皇寶照」，并收丘公（丘延翰，唐）頌，杂糅多层
    性质: 技术
    对象: 阴宅
    学派: 形势兼理气

  - 卷: [655]
    书: 青烏先生葬經
    题署: 青烏子（相传汉）
    实际年代: 唐宋
    年代可靠性: 托名
    理由: 汉代无此书著录；文体与《葬經》同层，四库馆臣已断为后出
    性质: 技术
    对象: 阴宅
    学派: 形势

  - 卷: [655, 656, 657, 658, 659, 660, 661, 662, 663, 664]
    书: 管氏地理指蒙（十卷，九十余篇）
    题署: 管輅（三国，209–256）
    实际年代: 唐宋
    年代可靠性: 托名
    理由: 三国无此书著录；篇目体例（第一至第九十余）为唐宋类书式
    性质: 技术
    对象: 阴宅
    学派: 形势为主
    本项目取用: 「擇向第二十三」——坐向作为独立步骤首见于此

  - 卷: [665]
    书: 郭璞古本葬經（內篇）
    题署: 郭璞（276–324）
    实际年代: 唐宋（《宋志》始著录）
    年代可靠性: 托名
    理由: 不见于《隋志》《唐志》，至《宋志》始著录。四库提要已指出
    性质: 技术
    对象: 阴宅
    学派: 形势
    本项目取用: A 级骨架全部出此——乘生气、界水则止、四势、五不葬、千尺为势百尺为形

  - 卷: [665]
    书: 楊筠松青囊奧旨
    题署: 楊筠松（唐末，约 874–888 在世）
    实际年代: 宋以后
    年代可靠性: 托名
    性质: 技术
    对象: 阴宅
    学派: 形势兼理气

  - 卷: [666]
    书: 楊公十二杖法
    题署: 楊筠松
    实际年代: 宋元
    年代可靠性: 托名
    性质: 技术
    对象: 阴宅
    学派: 形势
    尺度: 米级（点穴手法），30 m DEM 用不上

  - 卷: [666]
    书: 黃妙應博山篇
    题署: 黃妙應（唐僧）
    实际年代: 宋元
    年代可靠性: 托名
    性质: 技术
    对象: 阴宅兼阳宅、平地
    学派: 形势
    本项目取用: 「寬不至曠，狹不至逼」——「度」的概念，非单调判据的来源

  - 卷: [667]
    书: 廖禹十六葬法
    题署: 廖瑀（廖金精，南唐—宋，约 10–11 世纪）
    实际年代: 宋
    年代可靠性: 存疑
    性质: 技术
    对象: 阴宅
    学派: 形势

  - 卷: [667]
    书: 胡矮僊至寶經 / 謝和卿神寶經 / 玉元子天寶經 / 劉見道乘生祕寶經 / 孫伯剛璚林國寶經
    题署: 胡矮仙、謝和卿、玉元子、劉見道、孫伯剛（皆宋人）
    实际年代: 宋元
    年代可靠性: 存疑
    性质: 技术
    对象: 阴宅
    学派: 形势
    尺度: 多为穴场米级

  - 卷: [668]
    书: 空石長者五星捉脈正變明圖
    题署: 空石長者
    实际年代: 宋元
    年代可靠性: 存疑
    性质: 技术
    对象: 阴宅
    学派: 形势
    注: 分「高山／平岡／平地」三格论五星——**这是语料里最早的按地形分层**

  - 卷: [669]
    书: 劉基堪輿漫興
    题署: 劉基（1311–1375）
    实际年代: 明
    年代可靠性: 存疑
    理由: 堪舆书托刘基者甚多，本书未见于刘基本集
    性质: 技术
    对象: 阴宅
    学派: 形势
    本项目取用: 北龍／中龍／南龍三大干龙——全国尺度的上位结构

  - 卷: [670]
    书: 繆希雍葬經翼
    题署: 繆希雍（约 1546–1627）
    实际年代: 约 1600
    年代可靠性: 确定
    理由: 繆希雍为知名医家，生平著述可考，本书见于其著录
    性质: 技术
    对象: 阴宅（水口篇自带都會/帝王山陵的对象分层）
    学派: 形势
    本项目取用: "**16 条规则里 9 条出此**——穴病十五条、明堂三层与水四级序、水口对象分级"
    注: "**全部技术文献里唯一年代确定者之一**"

  - 卷: [671, 672, 673, 674]
    书: 水龍經（四卷，图五百余则）
    题署: 编次者蔣大鴻（1616–1714），所收图诀本身无名氏
    实际年代: 编次约 17 世纪中后期；所收材料更早，无从断代
    年代可靠性: 编次确定，内容存疑
    性质: 技术
    对象: 阴宅、阳宅（平洋）
    学派: 形势（但序文自称「全在八卦三元」，内文《自然水法》又斥「何用九星並八卦」——自相矛盾）
    本项目取用: "**B7 平洋法全部出此**——支干相扶、回头环绕、屈曲、澄清停蓄、干水散气"

  - 卷: [675, 676, 677, 678]
    书: 陽宅十書
    题署: 王君榮（明萬曆）
    实际年代: 明万历（约 1590s）
    年代可靠性: 确定
    性质: 技术
    对象: "**阳宅**"
    学派: 混合——论宅外形属形势；福元、大遊年、穿宮九星、元空裝卦属理气；另有择日与符镇
    注: "**「形势与理气分家」这个说法对阳宅从来不成立，此书开卷即是混的**"

  - 卷: [679]
    书: 王充論衡（四諱論、難歲篇、詰術篇）
    题署: 王充（27–约 97）
    实际年代: 东汉，约 80 年
    年代可靠性: 确定
    性质: 批判
    注: "**全语料年代最早且确定者，而它是批判文献**"

  - 卷: [679]
