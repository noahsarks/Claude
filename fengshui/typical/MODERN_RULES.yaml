# 现代版规则 v1.1 —— 机器可读的最终规则集
#
# 与其他文件的关系：
#   ../rules_luantou.yaml   过程台账（含每一次撤回与失败），证明结论怎么来的
#   CHRONOLOGY.md           编年，说明每条规则是哪一层加的
#   works.yaml              文献编目，era 字段的来源
#   MODERN_RULES.md         本文件的散文版
#   quote_verify.py         把本文件每条 quote 拿去语料里机械核对
#
# 每条规则必带的字段：
#   级      A/B/C/D —— 不是可信度，是「谁说的、什么时候说的」
#   quote   原文，必须能在 masters/corpus/gjtsjc/ 里逐字找到（quote_verify.py 核）
#   出处    卷次
#   层      CHRONOLOGY.md 的分层代号
#   era     [起, 止] —— 以**实际成书年代**为起点，不以题署为起点
#   对象    阴宅 / 阳宅 / 城址 / 通用
#   尺度    [下限 m, 上限 m]
#   语式    判定式（可用于断已建成者）/ 祈使式（只可用于择址）
#   实现    引擎里的对应项，或未实现的原因

meta:
  版本: v1.1
  语料: 欽定古今圖書集成·堪輿部 651-680 卷（1726），正文约 34.2 万字
  引擎: ../luantou.py v0.8
  分级含义:
    A: 《葬經》层，自古沿用未变 —— 保留，作为骨架
    B: 后人新增，经受住时间，且原文可核 —— 保留
    C: 后人新增但有已知问题 —— 不并入形势判据，单列
    D: 本项目所加，原典无据 —— 删，或明确标为估值
  一条必须写在最前面的限定: |
    A 级五条全部落在 S4 托名层，即年代只能定到「唐宋」，且无一有确定作者。
    技术文献 66.1% 是托名，年代确定的只有 17.2%，而这 17.2% 全是明代。
    **这套判据最古老的部分，恰恰是年代最说不清的部分。**
    所以「A 级 = 最可信」是错的读法；A 级只表示「此后没再变过」。

# ── A 级：骨架 ────────────────────────────────────────────────
A:
  - id: A1_乘生气
    quote: 葬者，乘生氣也
    出处: 卷665 郭璞古本葬經·內篇
    层: S4
    era: [唐宋, 今]
    对象: 阴宅
    语式: 判定式
    实现: 目的论，不可计算，不参与打分
  - id: A2_得水藏风序
    quote: 氣乘風則散，界水則止。古人聚之使不散，行之使有止，故謂之風水。風水之法，得水為上，藏風次之
    出处: 卷665
    层: S4
    era: [唐宋, 今]
    对象: 通用
    尺度: [100, 6000]
    语式: 判定式
    实现: water 权重 > zangfeng 权重
    注意: 这是全项目**权重序关系的唯一原典依据**。序有据，具体数值无据
  - id: A3_双尺度
    quote: 千尺為勢，百尺為形
    出处: 卷665
    层: S4
    era: [唐宋, 今]
    对象: 通用
    尺度: [30, 6000]
    语式: 判定式
    实现: shi（0.3–6 km）/ xing（0.1–2 km）双层，随 scale 缩放
  - id: A4_四象
    quote: 元武垂頭，朱雀翔舞，青龍蜿蜒，白虎馴頫
    出处: 卷665
    层: S4
    era: [唐宋, 今]
    对象: 阴宅
    尺度: [100, 3000]
    语式: 判定式
    实现: xuanwu、hulong 两分量 + 四条凶格（拒尸、腾去、虎蹲、龙踞）
    避讳: 殿本作「元武」，非「玄武」
  - id: A5_五不葬
    quote: 氣以勢止，而過山不可葬也
    quote2: 氣以龍會，而獨山不可葬也
    出处: 卷665
    层: S4
    era: [唐宋, 今]
    对象: 阴宅
    语式: 判定式（门槛级，非扣分）
    实现: 过山、独山两条已实现，仅 mountain 模式
    未实现: 童、斷、石属岩土性质，DEM 算不了

# ── B 级：后人新增，保留 ──────────────────────────────────────
B:
  - id: B1_择向独立
    quote: 擇向第二十三
    出处: 卷657 管氏地理指蒙三
    层: S4
    era: [唐宋, 今]
    对象: 通用
    语式: 祈使式
    语料证据: 「擇向」一词只出现在 S4（4 次），此后各层皆 0
    外部证据: masters/analysis.md 结论三 —— 坐向来自生辰或规制，四案一致零案反例
    实现: 规则层已确立（坐向是输入，不从地形反推）；**引擎尚未强制为必填**
  - id: B2_度
    quote: 寬不至曠，狹不至逼，斯名全吉
    出处: 卷666 黃妙應博山篇
    层: S5
    era: [宋元, 今]
    对象: 阴宅
    尺度: [100, 2000]
    语式: 判定式
    实现: front_open 等非单调隶属函数（过高亦扣分）
    意义: 此前只说「要有」，这里开始说「要多少」——本项目全部非单调判据源出于此
  - id: B3_按地形分格
    quote: 論五星分高山平岡平地三格
    出处: 卷668 空石長者五星捉脈正變明圖
    层: S5
    era: [宋元, 今]
    对象: 阴宅
    语式: 判定式
    实现: 引擎的 mode（plain / mountain）即此意，但只分两格
    注意: "**这是语料里最早的按地形分层，比本项目的 mode 早七百年**。应改为三格"
  - id: B4_三大干龙
    quote: 北龍
    quote2: 中龍
    出处: 卷669 劉基堪輿漫興
    层: S6
    era: [明, 今]
    对象: 通用
    尺度: [50000, 3000000]
    语式: 判定式
    实现: 未实现。属区域上位结构，需全国尺度数据
  - id: B5_穴病清单
    quote: 元武拒尸者，星峰無降勢也
    出处: 卷670 繆希雍葬經翼·穴病篇
    层: S7
    era: [1600, 今]
    对象: 阴宅
    尺度: [30, 1000]
    语式: 判定式
    实现: 十五条实现七条（拒尸、坠足、折臂、割脚、虎蹲、龙踞、朱雀腾去）
    未实现: 貫頂（可算，零成本，应补）；破面（登记未接，见 fault_registry_reconcile）；其余六条尺度或语义超出栅格
    意义: "**从「怎样是好」转为「怎样是坏」的诊断清单，是判据形态的一次根本转变**"
  - id: B6_明堂水四级
    quote: 明堂者，穴前水聚處也
    出处: 卷670 繆希雍葬經翼·明堂篇
    层: S7
    era: [1600, 今]
    对象: 阴宅
    尺度: [80, 1500]
    语式: 判定式
    实现: v0.7 _mingtang_water()，聚水1.00/横抱0.75/朝水0.50/顺流0.25
    依赖: "**坐向必须已知**，否则该项不判并重新归一"
    缺陷: 「穴前」的扇区半角 ±45° 是本项目定的，原文无此数；七点里五点对它敏感
  - id: B7_水口对象分级
    quote: 若結都會及作帝王山陵，必有北辰尊星坐鎮水口
    出处: 卷670 繆希雍葬經翼·水口篇
    层: S7
    era: [1600, 今]
    对象: 城址 / 帝陵（原文自带对象层）
    语式: 判定式
    实现: "**未实现**。现行 water_gate 只算谷宽比且不分对象"
    意义: "**原文自己就区分帝陵/都城与一般墓穴**——layering 的轴 1 不是外加的分类"
  - id: B8_平洋支干
    quote: 以通流大水為行龍而為幹，溝渠小水為割界而為支
    quote2: 大江大河，雖有灣抱，其氣曠渺，與墓宅不親，斷難下手
    出处: 卷671 水龍經一·總論一
    层: S8
    era: [17世纪, 今]
    对象: 通用（平洋）
    尺度: [80, 4000]
    语式: 判定式
    实现: v0.8 _pingyang()，支幹相扶 1.00 / 有幹無支 0.40 / 有支無幹 0.40
    为什么后两者同值: 原文只说两者皆不若支干相扶，**未把这两者互相排序**，不臆造高下
    语料证据: 「支幹」一词 S8 出现 7 次，其余各层合计 2 次（且嵇康那 1 次是天干地支）
  - id: B9_平洋不论龙虎
    quote: 後世言地，知山之龍而不知水之龍，遂使平洋水局之地，傅會山龍之妄說
    quote2: 行到平洋莫問蹤，只看水繞是真龍
    出处: 卷671 水龍經一·序
    层: S8
    era: [17世纪, 今]
    对象: 通用（平洋）
    语式: 判定式
    实现: v0.8 平洋模式下 xuanwu、hulong 权重归零，其 0.14 转给 pingyang
    保留藏风的理由: 《水龍經》未论藏风，不能借它的名义删《葬經》的条目
  - id: B10_平洋势形
    quote: 以幹龍繞抱，取外氣形局；以支龍正息交會，取內氣孕育
    出处: 卷671 水龍經一·總論一
    层: S8
    era: [17世纪, 今]
    对象: 通用（平洋）
    语式: 判定式
    实现: 平洋模式下 shi 用 py_gan、xing 用 py_zhi
    注意: 干即势、支即形，**这是原文的话，不是本项目的类比**
  - id: B11_屈曲
    quote: 水法不拘去與來，但要屈曲去復迴，三回五度轉顧穴
    出处: 卷671 水龍經一·自然水法
    层: S8
    era: [17世纪, 今]
    对象: 通用（平洋）
    尺度: [100, 2400]
    语式: 判定式
    实现: py_bends（沿河道上下游各 1.2 km 数转向反复次数）
  - id: B12_澄清停蓄
    quote: 澄清停蓄甚為佳，傾瀉急流有何益
    出处: 卷671 水龍經一·自然水法
    层: S8
    era: [17世纪, 今]
    对象: 通用（平洋）
    语式: 判定式
    实现: py_grad（河道纵比降）
  - id: B13_干水散气
    quote: 幹水斜行，似有曲折，而非環抱，又無支水，以作內氣，總不結穴
    出处: 卷671 水龍經一·幹水散氣圖說
    层: S8
    era: [17世纪, 今]
    对象: 通用（平洋）
    语式: 判定式（门槛级）
    实现: v0.8 凶格「干水散气」，罚 0.35，与五不葬同量级
    理由: 原文说的是「總不結穴」，不是一般扣分

# ── C 级：有问题的，单列不并入 ────────────────────────────────
C:
  - id: C1_五音姓利
    quote: 宅有五音，姓有五聲，宅不宜其姓，姓與宅相賊，則疾病死亡，犯罪遇禍
    出处: 卷679 王充論衡·詰術篇（**引以驳之**）
    层: S1（约 80 年）
    era: [汉, 北宋末]
    对象: 阴宅 / 阳宅
    问题: 输入是姓氏声韵，与地形无因果关联
    被驳次数: 2
    第一次: 约 80 年 王充《論衡·詰術篇》——姓氏后起可变（事之氏姓、吏之氏姓），无从固定配属
    第二次: 约 640 年 呂才《五行祿命葬書論》——内部不自洽（《春秋》陳同为水姓与火姓）
    然后: 北宋皇陵仍一律按此定向（东南地穹、西北地垂），又行用四百年
    处理: |
      不作为判据；但**必须作为样本标签**——按五音姓利定向的遗址，
      形势判据对它天然不适用，应从形势验证集中单列。
      注意 VALIDATION.md 已实测：永定陵本地分位 84%，是八点最高——
      「形势模型给它低分」这个读法本身是错的，已撤回。
  - id: C2_玄空飞星
    出处: 不在语料内
    era: [清中叶, 今]
    问题: 判断依据是「建成年 + 坐向度数」，与地形无因果关联；各派挨星互不相容
    语料实证:
      飛星: 0
      挨星: 0
      九運: 0
      運星: 0
      替卦: 0
      兼向: 0
      下卦: 0
      城門訣: 0
      令星: 0
    必带的限定: |
      「元空／玄空」这个**名目**并非清代才有：S5《青囊奧旨》15 次，S7《陽宅十書》3 次。
      但那是两套别的东西——
      青囊奧旨的元空是「水口立向以消水，不論本龍」的立向法；
      陽宅十書的「元空裝卦」是按修造搬移次序起爻配大遊年吉星，原文自陈
      「此裝卦法，全不用天乙巨門吉星」，属八宅一系。
      「三般卦」4 次也全是「游魂、絕體、福德本宮」的八宅义。
      能说的只是：**三元九運＋二十四山陰陽順逆＋挨星起星＋山向雙飛这一整套排盘术，
      在这三十卷里一个字都没有。**
    处理: 与形势判据分算，永不混合；用于 1726 年以后的对象可，用于以前即为倒推
  - id: C3_托名
    era: [唐宋, 明]
    量化: 技术文献 307,025 字中托名 203,041 字，占 66.1%；年代确定仅 17.2%，且全为明代
    问题: 托名使方法看起来比实际古老，掩盖真实演变
    处理: 一切规则的 era 以**实际成书年代**为准，不以署名为准

# ── D 级：本项目自己加的 ──────────────────────────────────────
D:
  - id: D1_balance
    描述: 龙虎左右对称项，曾占 hulong 的 24.5%
    出处: 无
    反证: 原文「青龍蜿蜒，白虎馴頫」给左右规定了**不同**形态，全文无一处要求对称
    处置: v0.7 已删
  - id: D2_明堂扇区半角
    描述: 「穴前」判为 ±45° 扇区
    出处: 原文只说「穴前」，未给角度
    实测: 20°–90° 扫描下七个有坐向的点里**五点翻档**
    处置: 保留但标为估值；该项必须连角差一并输出，不能只给档位
  - id: D3_权重数值
    描述: 各分量的具体权重
    出处: 序关系有据（A2），**数值无据**
    处置: 保留但标为估值
  - id: D4_平洋四项权重
    描述: 支干 .40 / 屈曲 .25 / 环绕 .20 / 停蓄 .15
    出处: 只有「支干第一」有据——「余以支幹之說，為水龍第一義」
    处置: 其余三项之间的比例标为估值
  - id: D5_两水夹送
    描述: M_两水夹送
    出处: source 字段写的是「通行口诀」，非文献
    处置: "**应删**"

