# v0.2 新增 —— 来源为《葬经》全文（仓库中的 docs/葬经 为节选，缺以下段落）
# ══════════════════════════════════════════════════════════════

structure_change:
  id: S1_势形乘性
  quote: "千尺为势，百尺为形，势与形顺者，吉。势与形逆者，凶。势凶形吉，百福希一。势吉形凶，祸不旋日。"
  source: 葬经·内篇（仓库节选本缺此段，据全文补）
  problem_in_v01: |
    v0.1 把势(玄武/朝/水口)与形(明堂/贴身龙虎/得水)做加权求和，
    等于允许"势"补"形"、"形"补"势"——与原文「势与形逆者凶」直接矛盾。
  fix: |
    final = base × mismatch × Π(1−凶格)
    mismatch 由 |势分−形分| 决定，且不对称：
      势 < 形（势凶形吉）系数 1.30  —— 对应「百福希一」，罚重
      势 > 形（势吉形凶）系数 0.75  —— 对应「祸不旋日」，罚轻
    势 = .45·玄武 + .25·外堂朝案 + .30·水口关锁
    形 = .35·内明堂 + .30·贴身龙虎 + .20·得水 + .15·向背

new_faults:
  - id: F_四势反
    quote: "地有四势，气从八方…玄武垂头，朱雀翔舞，青龙蜿蜒，白虎顺俯。形势反此，法当破死。故虎蹲谓之衔尸，龙踞谓之嫉主，玄武不垂者拒尸，朱雀不舞者腾去。"
    source: 葬经·内篇
    change: v0.1 把这四条当一般扣分(0.15–0.25)；原文是「法当破死」，属否决级，提到 0.35–0.40
  - id: F_过山
    quote: "气以势止，而过山不可葬也"
    gloss: "势未止即龙仍在中途奔腾的过山，没有诸水会聚、群砂聚集，不可葬"
    source: 葬经·内篇（五不葬）
    metric: 群砂聚集(0.3–1.5km 内 24 方位中高出穴 15m 的占比) < 0.25 且 2km 内无汇流点
    penalty: 0.30
    gate: 仅山陇模式（原文为「山之不可葬者五」，且「平原无山只看水」）
  - id: F_独山
    quote: "气以龙会，而独山不可葬也"
    gloss: "周围是低陷的地形或周围是水而没有过脉的独山不可葬"
    source: 葬经·内篇（五不葬）
    metric: 脉连度(1.5–3km 内 24 方位中 P75 高出穴 30m 的占比) < 0.15
    penalty: 0.35
    note: 乾陵北峰实测脉连度 0.00、群砂 0.00 —— 按《葬经》确为独山。
          唐代「因山为陵」本就不遵《葬经》葬地口径，此为体系外特例而非模型缺陷。

new_metrics:
  - id: M_龙虎双尺度
    basis: 明十三陵龙山、虎山位于陵前约 6 km（水口砂），而贴身龙虎仅数百米
    change: 贴身龙虎 200–1200 m（权重 .70）+ 外龙虎 2000–6000 m（权重 .30）
  - id: M_明堂两层
    quote: "案内明堂舒畅开阳，案外大堂规模宏阔"
    source: 清代遵化九凤朝阳峪万年吉地相度记载
    change: 内明堂 100–800 m（权重 .60）+ 外堂 2000–6000 m（权重 .40）
  - id: M_两水夹送
    quote: "凡真龙气脉，必有两水相夹送"
    source: 寻龙点穴通行口诀（真龙气脉四标志之二）
    metric: 来龙轴线左右两侧 3 km 内各是否有水道，各计 0.5
    weight: 计入得水项 0.15

historical_note:
  quote: "承修王大臣率监督、监修、办事官、书吏、样子匠、算手会同钦天监风水官员复勘风水地势，详定陵寝基址的中心即穴位，以及陵寝建筑组群的中轴线即山向……进行抄平子，用白灰划出经纬方格网，测量各交点标高，形成定量描述地形的平格图"
  source: 王其亨谈清代建筑工程籍本
  implication: |
    清代相度的实操就是"格网化地形量测"——本引擎与样式雷在方法上同源。
    另注：原文中「穴位」与「山向」是分开确定的两个量，再次印证坐向应为输入而非推断。

still_not_implemented_v02:
  - {item: 童山, quote: "气以生和，而童山不可葬也", why: 需植被/土地覆盖数据（ESA WorldCover 已在数据清单但未接入）}
  - {item: 石山, quote: "气因土行，而石山不可葬也", why: 需裸岩类土地覆盖}

# ══════════════════════════════════════════════════════════════
# v0.3 新增 —— 来源为聚落考古实证研究，非风水典籍
# ══════════════════════════════════════════════════════════════
empirical_basis:
  primary:
    cite: 胡珂、莫多闻、毛龙江、李水城、王辉、曹炜、张翼飞《无定河流域全新世中期人类聚落选址的空间分析及地貌环境意义》，《地理科学》2011, 31(4):415-420
    sample: 陕北无定河流域 293 处龙山时期遗址
    factor_priority: [地貌类型, 距河流距离, 地面坡度, 河流等级, 地面朝向]
    findings:
      地貌类型: {黄土丘陵: 182.6, 沙地: 47.9, 山地: 25.3, 洪积平原: 18.9, 单位: 处/10^4km²}
      距河流水平距离: {"<300m": 376.74, "300-600m": 153.73, ">600m": 21.88, 单位: 处/10^4km²}
      距河流垂直距离: {"<40m": 213, "40-90m": 70, "90-180m": 10, 单位: 处}
      地面坡度: 各地貌区内均以 0-2° 密度最高
      河流等级: {"6-7级干流": 842.86, "3-5级": 252.27, "1-2级": 85.21, 单位: 处/10^4km}
      地面朝向: 阳坡79/半阳85/半阴60/阴69 —— 无显著倾向；作者用多角度光照模拟证明该流域阴坡同样受光充足
  corroboration:
    cite: 洛阳盆地全新世地貌环境演变研究
    finding: 二里头、偃师商城、周王城、汉魏洛阳故城、隋唐洛阳城五座都邑均位于盆地北侧宽广的二级阶地上
    implication: 阶地位置对都城(阳宅)同样是首要因子，不限于史前聚落

v03_changes:
  - id: M_距水垂直高差
    basis: 无定河 <40m 占 213/293（众数高于水平距离的 162）；洛阳盆地五都邑均在二级阶地
    metric: h0 − 最近水道高程；作为"二级阶地"的可计算代理
    membership: 15–40 m 满分，<3 m 或 >180 m 显著扣分
    weight: 得水项内 0.16
  - id: M_河流等级
    basis: 6-7级干流遗址密度是 1-2级支流的 9.9 倍
    metric: 1.5 km 内最大汇水面积（与 Strahler 单调等价）
    weight: 得水项内 0.10
  - id: M_地貌类型
    basis: 该因子在实证中排第一位
    metric: 按 3km 起伏度 + 局部坡度 + 粗糙度粗分 山地/丘陵台塬/破碎沟壑/平原
    status: 已计算但尚未计入评分 —— 原文用 1:50万地貌图+DEM+遥感+实地四源判定，
            纯 DEM 四分类的可靠性不足以直接赋权，先作为诊断字段输出
  - id: W_取消向阳项
    basis: 无定河实证坡向无显著倾向 + 光照模拟证否
    change: v0.1/v0.2 中隐含的向阳偏好取消，权重转入得水与藏风
  - id: M_距水水平距离重标定
    basis: 实证是"越近越好"（<300m 密度 376.7），v0.2 的 120–800m 平顶偏离实证
    change: 改为 300 m 附近达峰、600 m 以外快速衰减

v03_validation:
  test: 晋南豫北 1200 背景点重算，比较 v0.2 与 v0.3 的 AUC
  result: {tomb: {n: 37, v02: 0.577, v03: 0.590}, building: {n: 187, v02: 0.624, v03: 0.615}}
  verdict: |
    变化 ±0.013，远小于已测定的噪声本底（坐标误差 1.3 km 使效应衰减约 45%，
    效应本身仅 0.043，背景 SD 0.120）。结论不是"实证判据无用"，而是
    **当前验证条件分辨不出这个量级的规则改动**。在测量问题解决前，
    继续精修规则得不到反馈。

# ══════════════════════════════════════════════════════════════
# v0.4 / v0.5 —— 三次降噪尝试全部失败，据此改判诊断
# ══════════════════════════════════════════════════════════════
noise_investigation:
  premise: |
    上一轮上限测试测得：人工核准精度(±100m)下分数 SD 仍达 0.0197，占效应(0.043)的 46%。
    当时判断"这是指标高频敏感性造成的采样噪声，修它是纯代码工作"，并据此把
    人工核坐标的优先级下调。本轮三个实验推翻了这个判断。
  attempt_1_spatial_smoothing:
    changes: [h0 改 60m 邻域中位数, 扇区仰角 max 改 P97, 后方剖面 ±10° 三线平均, TPI/粗糙度先 3x3 低通]
    result:
      SD: {before: 0.0197, after: 0.0201}
      位移相关r: {250m: "0.751 → 0.734", 500m: "0.547 → 0.502", 1000m: "0.429 → 0.461", 2000m: "0.336 → 0.266"}
    verdict: |
      无效。四个位移档位中 v0.4 三降一升，无系统性方向。
      注：50 次抽样估 SD 的标准误约 0.002，0.0197 与 0.0201 统计上不可区分，
      正确表述是"无变化"而非"变差"。
  attempt_2_soft_fault_thresholds:
    rationale: 孝陵折臂在 ±100m 内有 30% 时间翻转，一次翻转即 0.15 跳变
    change: 全部凶格由硬阈值改为线性软阈值（ramp）
    result: {SD_before: 0.0197, SD_after: 0.0205}
    verdict: 无效。软化后惩罚随 gap_ratio 连续变化，而 gap_ratio 本身就在抖，
             跳变变成了等幅的连续变化
  attempt_3_water_metric_switching:
    rationale: 汇流网格 120m，移动 100m 可能整体切到另一条水道，使 4 个水指标同时跳
    test: 冻结全部水指标后重测 SD
    result: {水指标贡献: "平均 9%（秦陵 26%，其余约 0）"}
    verdict: 不是主因
  conclusion: |
    ±100 m 位移下约 0.02 的分数变化是**真实地形变异**，不是可工程消除的噪声。
    三个独立假设全部证否。更进一步：若分数在百米尺度上真实变化，
    则"穴"本身就是百米尺度的现象——这与《葬经》「百尺为形」（宋尺约 30 m）
    在数量级上一致。这不是引擎缺陷，是被测对象的固有性质。
  retraction: |
    撤回上一轮的优先级反转。坐标精度是不可绕过的真瓶颈，
    精验证集必须做，且没有便宜的替代路径。
  requirement_recomputed:
    effect: 0.043
    background_sd: 0.120
    r_at_250m: 0.734
    n_needed_at_250m: 226   # 80% 检验力, α=0.05, 每组
kept_anyway:
  note: |
    v0.4/v0.5 的改动虽未达成降噪目的，但本身更稳健，予以保留并如实标注：
    分位数取代极值（不受单个像元支配）、连续惩罚取代阶跃（擦线的点不再整份吃罚）、
    多线剖面取代单线。三者在统计上与旧版无法区分（SE≈0.002），非退步。

# ══════════════════════════════════════════════════════════════
# v0.6 —— 尺度是可调参数，且尺度选错是此前一切负结果的主因之一
# ══════════════════════════════════════════════════════════════
bug_found:
  id: B1_尺度参数形同虚设
  description: |
    metrics() 的 R 参数只控制读取窗口大小，所有分析环带（300/1200/2000/4000/6000 m 等）
    都是硬编码的。因此 R=6000 与 R=20000 给出完全相同的分数——第一次尺度检验是空操作。
  fix: 引入 scale 因子，全部环带按其缩放（3km 起伏度除外，它用于山陇/平洋模式判定，保持固定）

luoyang_case:
  method: |
    按用户建议改用"先出分级图、再看古迹落在哪一级"的口径，而非逐点比对。
    这一口径对坐标误差有容忍度——分区本身就是容差。
  study_area: {box: [34.52, 34.88, 112.20, 112.88], 面积: "约 40 x 62 km"}
  sites: 24 处国保单位（含二里头、隋唐洛阳城、东周王城、邙山陵墓群、白马寺、龙门石窟、恭陵、洛南东汉帝陵），
         另补汉魏洛阳故城与偃师商城两处参考点（坐标未核准）
  result_at_1x:
    grid: {step: 500m, cells: 9717}
    分级占面积: {I: 5.0, II: 15.0, III: 25.0, IV: 30.0, V: 25.0}
    古迹分布: {I: 4.2, II: 8.3, III: 16.7, IV: 58.3, V: 12.5}
    kvamme_gain_I_II: -0.600
    binom_p: 0.8856
    verdict: 明确的负结果——古迹集中在 IV 级（倒数第二档），五座都邑全部落在 III-IV
    附带发现: 分级图呈椒盐状，无连片分区。产品层面这是致命缺陷：没人能用噪点图选址。
  scale_scan:
    背景: 500 随机点，古迹 16 处（去除近边缘者）
    results:
      - {scale: "1x", 势: 6km, 形: 2km, AUC: 0.591, 落入前20%: 18.8, gain: -0.067}
      - {scale: "2x", 势: 12km, 形: 4km, AUC: 0.628, 落入前20%: 31.2, gain: 0.360}
      - {scale: "3x", 势: 18km, 形: 6km, AUC: 0.673, 落入前20%: 37.5, gain: 0.467}
    单调性: 六处代表性古迹在 1x→2x→3x 上全部单调上升（二里头 0.307→0.366→0.466）
    未完成: 4x/5x 扫描因耗时过长被中止，最优尺度尚未确定，3x 只是"已验证可用"而非"最优"
    interpretation: |
      都城与大型陵区是**盆地尺度**的选址，穴场级的 6 km 势尺度看不到它。
      这与洛阳盆地文献一致：二里头、偃师商城、周王城、汉魏故城、隋唐洛阳城
      均位于盆地北侧宽广的二级阶地，其"靠山"邙山在约 10 km 外，
      "朝案"为盆地南缘山地，尺度远超单个穴场。
    significance: |
      Kvamme 增益 +0.467 是本项目第一个正结果，且已进入工程可用区间
      （荷兰全国图各分区 0.20-0.79，Mn/Model 全州 0.73，黎巴嫩 0.64）。
  open_question: |
    尺度应当随"被选址对象的等级"变化：都城 > 陵区 > 单陵 > 民居。
    这与《葬经》「千尺为势，百尺为形」的比例结构一致，只是绝对值随对象量级放大。
    下一步需要按对象类型分别定标，而不是全局用一个尺度。

# ══════════════════════════════════════════════════════════════
# v0.7 —— 洛阳全格网验证：尺度 × 平滑的交互效应
# ══════════════════════════════════════════════════════════════
luoyang_full_grid:
  grid_3x: {step: 800m, cells: 3773, scale: 3x, 势: 18km, 形: 6km}
  retraction: |
    此前报告的尺度扫描 +0.467 偏高，予以撤回。该扫描为避边缘效应剔除了 8 个
    近边界点，而这些点恰好包含全部低分者（龙门石窟 0.095、宋陵采石场 0.130、
    邙山陵墓群 0.282）。剔掉最差样本必然抬高增益——自引入的选择偏差。
    全部 24 处不剔除时，3x 不平滑的增益仅 +0.039（p=0.541）。
  two_by_two:
    描述: 尺度放大与空间平滑各自单独几乎无效，合起来才有效——交互效应而非叠加
    results:
      - {scale: 1x, smooth: 0.5km, hit: "3/24", gain: -0.600, p: 0.885, frag: 24.5%}
      - {scale: 1x, smooth: 2.5km, hit: "5/24", gain: 0.040, p: 0.540, frag: 9.1%}
      - {scale: 3x, smooth: 0.8km, hit: "5/24", gain: 0.040, p: 0.540, frag: 26.1%}
      - {scale: 3x, smooth: 4.0km, hit: "11/24", gain: 0.564, p: 0.004, frag: 10.1%}
      - {scale: 3x, smooth: 5.6km, hit: "12/24", gain: 0.600, p: 0.001, frag: 7.6%}
      - {scale: 3x, smooth: 7.2km, hit: "15/24", gain: 0.680, p: 0.000, frag: 6.6%}
    interpretation: |
      3x 的场含盆地尺度信号但被逐格噪声掩埋，平滑将其提取；
      1x 的场本无该信号，平滑只是在平均噪声。
  speckle_diagnosis:
    原假设: 山陇/平洋二值模式开关（3km 起伏度 120m 阈值，未随尺度缩放）造成椒盐
    检验: 模式图相邻不一致率仅 3.2%/6.8% —— 模式图本身是连片的，假设基本证否
    真因: |
      分数图 Moran's I ≈ 0.575，连续场空间结构良好；椒盐是五级分位切割产生的。
      分级前对连续场做 4km 平滑，相邻等级不一致率 54.8% → 22.1%。
      即：噪声来自分级方式，不是分数本身。
  caveats:
    - 多重比较：试了 8 个组合，Bonferroni 校正后 p≈0.03，勉强显著
    - 增益随平滑窗单调上升无峰值；7.2km 时有效分区仅约 5x8 个，结论逼近平凡
      （"古迹在盆地里"）。选 4km 是因其保留约 10x15 个分区，非因数字最好
    - 单个盆地、24 个点，且混合都城/陵墓/寺观/石窟/近代建筑，分型后均不显著
    - 4x/5x 尺度扫描未完成，3x 仅为"已验证可用"非"最优"
  next:
    - 换关中或晋南复核，不重新调参 —— 检验可外推性的唯一办法
    - 按对象类型分别定标尺度（都城 > 陵区 > 单陵 > 民居）
    - 把平滑并入引擎作为尺度参数的一部分，而非画图时的后处理

# ══════════════════════════════════════════════════════════════
# v0.8 —— 关中复核失败，撤回洛阳结论
# ══════════════════════════════════════════════════════════════
guanzhong_replication:
  discipline: 参数一个未动。尺度 3x、步长 800m、分级前 4km 平滑、五级分位切、
              全部国保点不剔除。两个口径在看到结果前即声明。
  setup: {box: [34.22, 34.58, 108.60, 109.30], 面积: "约 40x64 km", cells: 3871, sites: 36}
  result:
    主口径: {n: 36, hit: 3, pct: 8.3, gain: -1.400, p: 0.984}
    去簇2km_预声明: {n: 25, hit: 3, pct: 12.0, gain: -0.667, p: 0.902}
    洛阳同协议对照: {n: 24, hit: 11, pct: 45.8, gain: 0.564, p: 0.0038}
  smoothing_sweep:
    说明: 不是给关中挑错了参数——每一档都是负的
    洛阳: {0.8km: 0.040, 2.4km: 0.400, 4.0km: 0.564, 5.6km: 0.600, 7.2km: 0.680, 8.8km: 0.680}
    关中: {0.8km: -0.440, 2.4km: -0.440, 4.0km: -1.400, 5.6km: -0.200, 7.2km: -0.200, 8.8km: -0.200}
  ordering_inverted: |
    半坡遗址（新石器村落）拿到唯一 I 级 0.463；
    大明宫 V(0.319)、阿房宫 V(0.291)、汉霸陵 V(0.326)、江村大墓 V(0.286) 全部垫底；
    秦始皇陵 IV、西安城墙 IV。引擎把唐代宫城排在了新石器村落之后。
  retraction: |
    **撤回洛阳 +0.564 作为预测力证据的定性。**
    在洛阳试过 8 个尺度x平滑组合并挑中奏效者；换一个盆地，同一组合给出 -1.400。
    最简约的解释：洛阳是恰好合适的数据集，引擎目前没有可外推的预测力。
    此前所有基于洛阳的乐观表述（含"首个统计显著结果""进入工程可用区间"）一并作废。
  not_explained: |
    两区分数分布接近（洛阳 P80=0.470，关中 P80=0.434），故不是标定问题。
    "因山为陵被平地起穴规则判低"可解释关中陵墓，但解释不了大明宫、阿房宫、
    西安城这些阳宅也全在 IV-V。规则在关中的宽平原上抓错了东西，具体是哪一项未知。
  next:
    - 单因子诊断：七个分项分别算两区增益，定位哪一项在关中反向 —— 唯一能把失败转成信息的一步
    - 第三个区域（晋南豫北瓦片已在本地），两区一正一负等于没有方向
    - 在拿到可复现的正结果之前不要再调参；洛阳这轮已演示调参能调出 p=0.004

# ══════════════════════════════════════════════════════════════
# v0.9 —— 田野记录：从业者的实际做法，与本引擎的差距
# ══════════════════════════════════════════════════════════════
ethnography:
  source: |
    Youcao Ren, "Feng shui: Changing Rules and Meanings", White Rose eTheses（开放获取，322 页）
    第 5 章为 2015-2017 浙江武义/金华参与观察，对象陶振成，家传五代乡村风水先生
  value: 记录的是"他在现场做了什么、按什么顺序"，而非"应该怎么做"

  case_tomb:
    地点: 金华西头村公墓
    候选: 三个 1.3m x 1.3m 格子，同排同朝向，仅"面对景色略有不同"
    procedure:
      - 上门前已按死者生辰算定朝向
      - 到场摆罗盘反复微调取精确读数，确认下葬时刻
      - 三选一的判据是"前方山的层数越多越好"，选中正对五层山者
      - 最终强调穴前小山与其后群山连同环河构成"元宝形"，主财
  case_house:
    地点: 武义大溪口村
    procedure:
      - 争议角上先量鲁班尺，读数记录并向邻居解释
      - 用 0.32m 风水尺连放 8 次定新点，房屋整体后退 2.4m
      - 每个可能墙角摆罗盘，确认原方案利己损邻
      - 令另一邻居当场调整烟囱朝向
      - 看备选地时未摆罗盘，只说"背后山景好但离聚落中心远，招不来那么多福气"
      - 择日、写契书报土地神
    role: 论文明确称其职能为社区调解人（mediator），产出是邻里都接受的方案

  gaps_vs_engine:
    - {他: 坐向来自生辰，上门前已定, 我们: 花三轮试图从地形推坐向 —— 设问就错了}
    - {他: 决策空间三个 1.3m 格子、房屋挪 2.4m, 我们: 最细约 100m 且该尺度分数抖动 0.02}
    - {他: 地形判据是"前方山的层数"（数了五层）, 我们: 七分项中无此项，量的是仰角不是层数}
    - {他: 最终判断是整体形状识别（元宝形）, 我们: 加权求和产生不了形状判断}
    - {他: 离聚落中心远近参与判断, 我们: 纯地形，无社会变量}
    - {他: 输出含时间（九天后下葬）与契书, 我们: 只有一个分数}

  historical_lead:
    fact: 唐宋流行"五音"之法，朝向由姓氏读音决定；北宋皇陵即依五音行事
    implication: |
      北宋皇陵在巩义，正落在此前"晋南豫北"样本区内。若一批陵墓按姓氏读音定向，
      任何地形模型对其必然失败 —— 不是模型不好，是定向变量不在地形里。
      为关中复核失败提供了新的排查方向：逐点查定向依据，而非继续调地形参数。

  caveats:
    - n=1 位风水师、一个地区、一份民族志，不可推广为"风水师都这么工作"
    - 城市"大师"做法不同：用软件按生辰算日期朝向、用 Google Earth 演示墓地，
      更偏理气 —— 说明市场上已有的软件是理气类而非地形类
    - 1997 年《殡葬管理条例》禁野葬，当代多为公墓内选格，旷野点穴已属少数
    - 仅读了这一份；Feuchtwang 与 Freedman 对推理结构的分析尚未读

  actions:
    immediate:
      - 坐向由"推断"改为"必填输入"，停止一切从地形推坐向的尝试（无需更多验证即可改）
      - 新增"前方山层数"指标：沿视线方向数山脊穿越次数 ——
        这是田野记录里唯一被明确说出口的地形判据
    acknowledged:
      - 引擎目前答的是"这一片区域好不好"（公里级），风水师答的是"这三个格子选哪个"（米级），
        是两个不同产品，不应混谈
      - 喝形/形状识别需另辟路径（模板匹配或视觉模型），本轮不动手
    before_refactor:
      - 先读 Feuchtwang，一份民族志不足以支撑架构重构

# ══════════════════════════════════════════════════════════════
# v0.10 —— 城市从业者：产品定位与成功标准都要改
# ══════════════════════════════════════════════════════════════
urban_practitioners:
  source: 同 v0.9（Ren 论文第 5 章），杭州/金华部分

  wu_lian_workflow:
    背景: 河南学徒出身，客户建议"南方市场大得多"，2010 年在杭州开咨询店
    步骤:
      - 出发前用 Google Earth 选候选点位，"从更大的尺度上识别龙脉"
      - 维护一份候选穴位清单，分"小穴"（主财丁）与"大穴"（主大贵，尤政治权力）；
        大小指气的强弱/风水品质，非地块尺寸
      - 按客户诉求从清单里挑一个实地复核（带罗盘）
      - 室内案子先要平面图再上门；店内用理气软件按生辰算日期与朝向
    implication: |
      这四步正是"卫星影像大范围筛 → 势尺度识别龙脉 → 候选清单 → 按需分等 → 实地复核"。
      我们的热力图+分级+单点报告恰好覆盖前四步。吴莲现在用肉眼在 Google Earth 上做。
      目标用户应是从业者，不是终端消费者。

  success_criterion_change:
    问题: |
      吴莲用卫星图做的是"从大范围召回候选"，不是"给定点排序"。
      他的成功标准是"筛出的点里有几个经实地复核可用"。
      我们此前所有 Kvamme 增益检验测的是"历史古迹是否落在高分区"——测错了对象。
    含义: 召回问题允许高假阳性。筛出 50 个点、实地砍掉 45 个，仍是成功的工具。

  market_structure:
    供给: 传统先生太少，培训班出身的"风水大师"（一到数周课程）构成主体
    阴宅: 城市大师普遍不做，理由是"做不好会反噬从业者自身"；
          吴莲以能做阴宅自别于培训班出身者 —— 地形分析恰是阴宅业务核心，且供给稀缺
    山水换建筑: 杜金良给工厂定向的原话——周围建筑就是"山"，新厂房必须最高且朝南，
                "压过周围的气"即压过竞争对手。注意这是零和的相对判断，
                我们的引擎算绝对分数，框架不适用
    既有软件: 全是理气类（按姓名生辰算命盘、日期、朝向）。刘自称 "a man of software"，
              称"风水软件更准更高效，因为它是科学的"。地形分析在该生态里是空白 ——
              空白既可能是机会，也可能是没需求
    收入结构: 陶振成一上午 300 元；刘的石雕龙 3000 元、风水喷泉 3800 元、符 88-500 元。
              城市业务利润来自法器与室内咨询，不来自选址

  actions_revised:
    - 用户定位改为从业者；成功标准改为召回率（筛出候选中经复核可用的比例），
      而非古迹落区命中率。此前全部验证测错了对象
    - 坐向改为必填输入（来自生辰，非地形）
    - 新增"前方山层数"指标
    - 分级改为结果导向的分类（财丁 vs 权贵），而非品质回归
    - 城市业务不碰：山水换建筑、零和相对判断、利润在法器，地形分析无位置
    - 架构重构前先读 Feuchtwang

# ── v0.11：既有软件源码审计（2026-09-02）───────────────────────────────
# 详见 audit/existing_software.md；对照脚本 audit/three_way.py
software_audit:
  读了什么:
    - Sudo-Biao/suangua —— 纯 Python，core/fengshui/ 24 模块约 6000 行
    - Horace-Maxwell/Horosa —— React 前端 fengshui/ 47 文件约 10900 行
    - 商业产品（袖裡乾坤飛星風水、fscalc、bazicode、astrology-api 等）只能看功能描述

  发现_峦头不是地形:
    事实: |
      suangua 的 xuankong_luantou.py 无任何地形输入，读飞星盘 if-else 拼建议文本
      （"此方宜见水"是祈使句，软件从不知道那里有没有水）。
      Horosa 的 xingshi.js 是龙穴砂水向五诀评分，入参 sel={} 全为人工勾选，
      背后挂 167 条古籍枚举（定穴十三法/证穴十三法/明堂吉九凶九/龙虎断十五/水口五煞三关…），
      是已知最完整的峦头知识结构化——但软件只做加减法（+2/-2/+1，阈值 7/3/-1）。
    含义: |
      现存最好的峦头实现把峦头当结构化判断表单，不当计算。
      我们试图自动化的正是它交还给人的一步——地形感知。
      而我们自己的测量显示那一步信噪比约 1:1（效应 +0.043，1km 位移噪声 0.042）。
      两边从相反方向指向同一结论。

  发现_户型图无图像识别:
    事实: |
      Horosa"上传户型图"只把图当画布背景。用户手工设正北、用 16 类点标记打点、
      可选画轮廓。neijuGeometry.js 的规则全是初等几何：
      开门见灶=连线偏角≤15°且距≤0.9 对角线；穿堂=偏角≤12°且距≥0.6 对角线；
      狭长=长宽比≥2.5；缺角=该宫 12×12 采样过半落轮廓外。约 200 行。
    含义: |
      风水规则是整个功能里最简单的部分；难的是从图纸得到那些点，
      而最好的开源实现直接放弃自动解析。自动解析是纯 CV 工程，与风水知识无关，
      且失败模式（认错一个马桶）会静默污染下游全部判定。
      起步应照抄：手工打点，CV 作后续增量。

  发现_理气排盘会算错:
    事实: |
      标准挨星诀：山盘入中星 X = 运盘坐山宫之星；顺逆由「X 所属卦中、与坐山同元龙
      （天/地/人）之山」的阴阳决定。
      suangua 误用「坐山自己的阴阳」（xuankong.py: mtn["yin_yang"]）。
      其二十四山阴阳表本身是对的，错在用到了错的山上。
      Horosa liqiCore.js 用 GONG_YUAN[`${Vx}|${yXiang}`][1]，即正确规则。
    实测: |
      9 运 × 24 坐山 = 216 局三方对照（audit/three_way.py）：
        Horosa  与沈氏标准一致 216/216 = 100.0%
        suangua 与沈氏标准一致  60/216 =  27.8%
      八运旺山旺向：标准与 Horosa 均为 丑巽巳未乾亥（6 山）；
      suangua 给出 12 山（旺山旺向按定义稀缺，一半坐山上吉本身不可能）。
      教科书例题「子山午向」标准为双星到向，suangua 报旺山旺向。
    含义: 若要做理气，移植 Horosa 的 flyChart，并以这张 216 局表作回归基准，不要自己写。

  发现_权重全无校准:
    事实: |
      Horosa scoreNaqi：base 100，破气/破水 -15、双卫 -12、龙虎 (level-3)*2、在位物封顶 +10。
      注释自陈"锚点：一处破水+充足在位物≈95分"——锚在想要的输出上，不在证据上。
      形势评分 +2/-2/+1 同理。
    含义: |
      我们的权重同样是手拍的。区别只在于我们拿它和考古基准对撞过并报告了没通过。
      全行业没有第二份这样的测量——这是本项目目前唯一确凿的差异化资产。

  可抄的:
    Horosa_neijuDetect_三层诚实防线: |
      ① 只对有充分输入的项给判定，缺标记者一律不判并列出「缺什么」，
         绝不用「没检测到」冒充「没有此凶局」；
      ② 判定是建议，人工勾选优先，不一致时同屏并陈；
      ③ 每条给证据（坐标、距离、偏角、比值），可逐条复核。
      其输出中 skipped 常长于 hits（横梁、镜子、房间形状、地面标高全部老实列为缺）。
      我们的引擎只输出一个 0-1 分，做不到逐条复核 —— 应改。

  未解决:
    地形层是空白已确认（两个最完整开源实现 + 一圈商业产品均未接 DEM）。
    但空白的原因读源码区分不了：是"没人做到"还是"做了没人买"。
    民族志已提示城市从业者利润在法器与室内咨询、阴宅业务被普遍回避，
    倾向后者。需要的是需求验证，不是更多代码。

# ── v0.12：商业软件地理逻辑反编译与横向对比（2026-09-02）──────────────
# 详见 audit/geo/README.md；脚本 audit/geo/{decl,pipeline,attribute}.py
geo_software_audit:
  apk_反编译:
    结果: 未取得 APK。jadx 1.5.1 已装（/home/user/rev/jadx），有包即可跑。
    阻塞点: |
      apkcombo 能拿到下载链，但均 302 至 download.pureapk.com → apkpure.com，
      Cloudflare 对机房 IP 一律 403；apkpure/apkfab/apk.support/androidfreeware 同；
      apkmonk 网关 502。无头 Chromium 走会话代理时全站 ERR_CONNECTION_RESET
      （该 Chromium 未加载代理 CA），按环境规则不得关闭 TLS 校验，故封死。
    副产发现: |
      小米商店/应用宝/华为市场、华军/非凡/绿色下载站搜「风水」均返回默认热门软件——
      风水类应用在大陆分发渠道已被清理，只活在 Google Play 港台/海外市场。
    替代物: |
      fscalc.com 是真实运营的商业风水站（Stripe 付费墙），整站是一个 734KB
      生产环境压缩 JS 包，与 APK 同性质且完全可读。摘录存 audit/geo/fscalc_extract.js。

  商业软件的地理逻辑:
    事实: |
      fscalc 中唯一接触经纬度的路径：latLng → /api/getNoaa → NOAA calculateDeclination
      → toFixed(1) → magneticNorthOffset → 旋转罗盘叠加层。全包搜索
      elevation/terrain/slope/river/road/altitude/landform/contour/DEM 全为 0。
      Google 卫星图只作可旋转背景底图。
    含义: 「地理位置」在商业风水软件里 = 磁偏角查询，没有任何地形计算。三个独立实现一致。

  同位置横向对比:
    链条: 罗盘读数 --(磁偏角)--> 真方位角 --(24山界)--> 坐山 --(挨星)--> 格局
    地理步骤差异:
      fscalc: NOAA WMM 在线（现 WMM-2025），东偏为正，连续，0.1° 精度
      Horosa: 内置 ~340 城查表，2013-06 快照，西偏为正，不插值不外推
      suangua: 无磁偏角，度数照单全收
    实测磁偏角(2026-09, 西偏为正): 洛阳5.24/杭州6.09/北京7.56/哈尔滨11.36/广州3.28/西安4.19
    与Horosa2013之差: 东部普遍 +0.7~1.0°（年变率 -0.02~-0.04°/年）
    端到端例: |
      杭州罗盘读 178.0° → fscalc 坐壬双星到向 / Horosa 坐子双星到坐 / suangua 坐子旺山旺向
      洛阳罗盘读 172.0° → 三者坐山一致(壬)，但 suangua 因挨星错报「上山下水」

  差异归因_按量级:
    一_不做磁偏角校正: |
      山宽 15°，中国东部磁偏角 3-11°。不校正则错山比例 = |磁偏角|/15：
      哈尔滨 76%、北京 51%、杭州 41%、洛阳 35%、广州 22%、拉萨 0.5%。
      实测（扫 3600 个读数）与理论值逐城吻合。
    二_磁偏角数据陈旧: |
      Horosa 2013 表 vs 2026 实测差 0.7-1.0°，即 4.7-6.7% 读数落到相邻山。
      按年变率，到 2040 年该比例翻倍。
    三_挨星规则错: |
      suangua 216 局错 156 局；九运 24 山全错（24/24）——2024-2043 年间
      对任何房子的格局判断都是错的。故「格局分歧 100%」不是巧合。
    四_符号约定坑: |
      西偏为正 vs 东偏为正，弄反则误差是磁偏角的两倍：
      哈尔滨 22.7°(1.52 个山)、北京 15.1°(1.01)、杭州 12.2°(0.81)、洛阳 10.5°(0.70)。

  挨星正确性三方核验:
    沈氏标准(本项目参考实现): 基准
    fscalc: 216/216 一致（用入中星奇偶代替查表，含五入中情形严格等价）
    Horosa: 216/216 一致
    suangua: 60/216 一致（27.8%）
    参考实现自检: 一运与九运各 12 双星到向+12 双星到坐（无旺山旺向、无上山下水）；
                  五运 12 旺山旺向+12 上山下水；二三四六七八运各 6/6/6/6。三条公认性质均复现。

  对本项目的意义:
    - 地理位置评分在商业软件里彻底空白，比此前判断的还彻底
    - 但同一空白里有一个真实、可量化、当前普遍做错的问题：坐向定位。
      磁偏角不做/做错/用过期数据，能让 20-76% 的案例落到错误的山上，山错则整盘全错
    - 该问题每一步都有唯一正确答案、可用 216 局表回归验证 ——
      与地形评分（信噪比 1:1、对错无法验证）性质相反
    - 若做地理方向，第一块砖应是「坐向定位」而非「地形评分」：
      经纬度+日期 → WMM/IGRF 实时磁偏角（标注符号约定与年代）→ 真方位角
      → 24 山（标注离边界多远、是否兼向）→ 正确挨星起盘

# ── v0.13：近二百年风水师名录与案例拆解（2026-09-02）───────────────────
# 详见 masters/{README.md,roster.yaml,analysis.md} 与 masters/cases/
masters_case_audit:
  规模: 名录 34 人（1826-2026，分 5 大类）；案例 8 有内容（A 级 5、C 级 3）+ 1 待取（B00）
  证据分级: A 第三方独立记录 / B 术者著述 / C 媒体传记 / D 不采信（排行榜软文）

  检索边界_必须先讲清:
    拿到: Ren Youcao PhD thesis 全文（本地 thesis.txt），其第五章是本目录 A 级案例唯一来源
    没拿到: |
      章仲山《阴阳二宅录验》、沈竹礽《宅断》、谈养吾《大玄空实验》全文。
      archive.org 有《增广沈氏玄空学》但属借阅馆藏（_djvu.txt 返 401）；
      360doc 转载页 403；知乎 403；百度百科连接重置；
      archive.org 全文检索只命中香港旧报纸，其竖排繁体 OCR 完全不可用
      （实测 NPWK19900620_djvu.txt，「風水」命中 0 次）。
      故清代案例只登记条目与出处，不写任何内容，不编造原文。

  发现一_地形只在阴宅是核心:
    统计: 8 案中地形为决定因素 2 案（A02 陈家墓穴、A03 吴莲选穴），存疑 1 案，其余 5 案地形不参与
    分野: 不是古今，是阴宅 vs 阳宅。两个地形决定的案例都是阴宅；城市阳宅案例里建筑完全替换山水
    夹击结论: |
      地形分析只在阴宅业务里是核心，而阴宅正是当代城市从业者集体回避的一块
      （「做不好会反噬自身」）。这解释了为何反编译的三个软件都不接 DEM——
      它们服务城市阳宅市场。市场空白是真的，但空白的形状是「阴宅工具」，不是「风水工具」。

  发现二_坐向来自生辰而非地形:
    证据: A02 死者生辰（且先于踏勘）、C02 霍英东八字、A04 商业竞争、C03 卦位；0 案反例
    含义: 引擎目前扫描朝向取地形最高分，与全部可查实践相反。坐向必须改为必填输入。

  发现三_新指标 ridge_layers:
    来源: A02 是全部材料中唯一一次术者对地形做计数——「前方山层数越多越好，层数代表气的强弱」，选五层山那一穴
    实验质量: 三候选穴同排、同朝向、同尺寸 1.3x1.3m，理气坐向择日全固定，唯一变量是视野——罕见的单变量对照
    现状: 引擎七个分量中没有任何一个是这个
    定义: 沿朝向 ±θ 的高程剖面上，统计穿越局部极大值（山脊）的次数

  发现四_材料的三个系统缺陷:
    无否定样本: |
      C02 记下蔡伯励选中柴湾，未记他跑遍香港否决了哪些地方。全部 C 级材料皆然。
      只有正样本无法检验判据——「背山面海左右护卫」能套在任何已建成的墓地上。
      A02 是唯一例外（记下三个候选与淘汰理由）。
    应验皆事后归因: C03「住八九年活到一百岁」、A03「望族的成就」，先有结果再找地形解释，只报成功
    著述与实操未必一致: |
      C03 记述者把「草庐布局与他书上公开的图完全不一样」当正面卖点。
      这是对全部 B 级材料的警告：我们此前从《葬经》《撼龙经》提炼规则时默认了书=实操，该假设需打折。

  发现五_对洛阳关中矛盾的修正解释:
    此前归因: 模型不稳，故撤回洛阳 +0.564
    新解释_A05: |
      北宋皇陵按五音姓利定向：赵姓属角音利壬丙，故一律头枕东南足抵西北，
      与「背山面水坐北朝南」正相反。巩义宋陵就在我们采样的晋南豫北区内。
      正样本混着至少四种择址范式（形势派、五音姓利、政治军事、漕运），
      合并成同一个「风水好」标签等于把几个不同目标函数平均掉。
    修正后的下一步: |
      单因子诊断不应把古迹一锅煮，应先按朝代与遗址类型分层
      （陵墓/宫殿/寺观/城址；宋 vs 非宋），再看各分量增益在哪一层成立。
      比继续调平滑参数或换第三个区域更有希望。

  发现六_一条反向的可计算量:
    来源: A01 陶振成否决备选地块的理由——「此地风水好，后山景色美，但离居住中心太远，招不来那么多运气」
    含义: 到聚落质心的距离是可计算的，且方向与我们全部地形分量相反——
          引擎奖励藏风聚气的僻静地形，术者惩罚偏远。这是引擎与实践的直接冲突，值得单独验证。

  自我提醒:
    标本: C03 的「能量值 36000 分」——精确到个位，无单位、无量法、无可重复性
    对照: 我们的引擎输出 0-1 分。若不能逐项给出中间量与可复核证据，与「36000 分」无本质区别
    做法: 照抄 Horosa neijuDetect 的三层诚实防线

  最大缺口:
    B00: 清代三部逐案记录体案例集原文未取得
    价值: 每案给「坐向(含兼线)+元运+形势+飞星盘+断语+应验」，体例上已是结构化数据集
    取得后第一件事: 用已验证的 216 局挨星表复算其飞星盘，做一次跨二百年的回归测试
    途径: 心一堂重印本 / archive.org 借阅账号 / 国图台图古籍库

# ── v0.14：第二轮语料检索——《古今圖書集成·堪輿部》全 30 卷（2026-09-03）──
# 语料 masters/corpus/gjtsjc/；案例 masters/cases/A06-A10
corpus_round2:
  取得: |
    《欽定古今圖書集成·博物彙編·藝術典·堪輿部》第 651-680 卷全文，
    1.3 MB 约 42 万字，来自 zh.wikisource（页面自带公有领域声明），
    MediaWiki action=parse API 抓取，脚本 masters/corpus/fetch/。
    含葬經、撼龍經、疑龍經、葬經翼、水龍經、陽宅十書、管氏地理指蒙、青囊海角經，
    以及卷679 名流列傳（114 人）、卷680 藝文（历代批判文献）+ 紀事（正史案例）+ 雜錄。

  A06_牛头山之争:
    价值: 本目录第一个有否定样本的可测案例
    内容: |
      北宋营永定陵（约 1022，河南鞏義）。徐仁旺主张用牛頭山「前」地，
      丁謂（山陵使）定用「後」地。徐反对山后地的理由：
      「坤水長流，災在丙午歲內；丁風直射，禍當丁未年中」；
      吳景鸞就同一处：「坤風側射，厄當國母離宮；坎水直流，禍應至尊下殿」。
    可测性: |
      四条判据都是「方位+地形要素+形态」三元组，可从 DEM 直接算：
      坤方(202.5-247.5°)水系、丁方(187.5-202.5°)风口、坎方(337.5-22.5°)水系。
      对应引擎现有的 water 与 zangfeng 两个分量。
    意义: |
      把引擎从「这块地得几分」变成「A 处坤方水是否强于 B 处」——
      一个有确定答案的比较问题。这是引擎第一次可被证伪。
    折扣: 应验隔 104 年（靖康），是事后追记；干支六十年一轮，命中不含信息量。

  A08_产品形态的第二条独立证据:
    内容: 駱用卿擇明世宗永陵，「擇地於十八道，具圖說以進」（《紹興府志》）
    含义: |
      全部语料中唯一记下候选数量的一案。交付物是「候选点位图 + 逐条理由」，
      拍板的是皇帝不是术者。
      与 A03（吴莲用 Google Earth 维护候选清单）跨五百年一致：
      专业选址的输出形态历来是「带理由的候选清单」，不是一个分数。
    修正: |
      此前此结论只有 A03 一个来源（n=1）。现在是两条独立证据、相隔五百年、场景完全不同。
      「经纬度→一个 0-1 分」这个形态在历史实践与当代实践里都没有对应物，
      不再是可商量的产品选择，而是与全部已知实践都对不上的错误设定。

  A09_凶格是门槛式不是加权求和:
    内容: 管輅论毋丘儉墓「元武藏頭，蒼龍無足，白虎銜尸，朱雀悲哭，四危以備，法當滅族」
    含义: |
      四项同时成立才断，不是四项分数低到阈值就自动成立。
      引擎 v0.2 已把势/形改成乘性，但七个分量之间仍是加权求和——
      加权求和允许一项极差被另几项补偿，古典判词不允许。
      这是可立即改、且有明确古典依据的结构调整。
    附: |
      同卷郭璞「葬龍角/葬龍耳」：同一处地形因命名不同而结论相反（灭族 vs 致天子）。
      这是「1km 位移噪声≈效应量」的古典版本——判断对形态命名极度敏感，
      而形态命名本身没有客观标准。
      又「白虎銜尸」「朱雀悲哭」判的是形态与声音，不是有无与高低，这一层我们算不出。

  A10_唐代已做过同类基率检验:
    内容: |
      呂才《五行祿命葬書論》（约 640，唐太宗命其刊定阴阳书）：
      「今檢葬書，以己亥之日用葬最凶。謹按春秋之際，此日葬者凡有二十餘件，
       此則葬不擇日，其義二也。」
      对五姓的证伪：无出处 + 姓氏后起无从配属 + 内部不自洽（陳同为水姓与火姓）。
    含义: |
      ① 「拿历史样本检验风水规则」不是现代的也不是外来的，在中国有 1400 年内部传统。
      ② 决定北宋皇陵朝向的五音姓利，在被用于皇陵之前四百年就已被唐代官方否定。
      ③ 呂才先说清规则预言什么再去数。我们在洛阳是先跑格网、看到 +0.564 才去解释，
         顺序是反的，这也是关中给出 -1.400 时无法收场的原因。
         关中复核用的是正确流程（预先声明参数、不重新调参、不换区域再试），
         应固定为此后所有验证的强制流程，而非一次性补救。
    附: 整卷藝文（1.86 万字）全是历代质疑文章且收入钦定官修类书——
        批判风水是这门学问自身的组成部分，本项目做的是这条内部批判线的延续。

  正样本标签是混合物_三重确认:
    A05: 北宋皇陵按五音姓利定向，头枕东南足抵西北，与形势通则相反
    A10: 五音姓利在 640 年已被唐代官方以内部不自洽为由否定
    A06: 同一批宋陵的位置又由牛頭山前后的形势之争加政治决定
    结论: |
      巩义宋陵朝向由一套当时已知不成立的规则定死，位置由另一套规则加政治决定。
      把它们与明清陵、寺观、城址一起当作「风水好」的正样本，
      则洛阳 +0.564 与关中 -1.400 的矛盾来源不是模型不稳，是标签本身是几套规则的混合物。
      第一轮由 A05 提出，第二轮由 A10 与 A06 独立确认两次。

  材料形态统计_这本身是结论:
    样本: masters/corpus/bios679.json，114 位堪輿家传记
    分布: |
      只有姓名+籍贯+著作            约 60 条
      有姓名+地点+结论，无判据       约 40 条
      有明确判据（说出为什么）        不到 10 条
      有判据且有被否决的候选          2 条（徐仁旺 A06、郭璞葬龍角/龍耳）
    含义: |
      一千多年的堪輿文献留下的是人名、地点和结论，判据极少，可比较的候选几乎没有。
      「用历史案例验证地形规则」这条路的上限不取决于我们能找到多少材料，
      而取决于古人根本没有记录我们需要的东西。
      呂才 640 年能做基率检验，是因为他检验的是「己亥日下葬」这种可数的离散事件；
      「这块地的玄武是否垂头」不是可数事件，1400 年里也没人把它记成可数的形式。

# ── v0.15：清代案例集原文到手（2026-09-03）──────────────────────────
# 语料 masters/corpus/shen/；案例 masters/cases/B01 B02；脚本 corpus/{regress_qing,consistency_test}.py
zhaiduan_corpus:
  取得: |
    《沈氏玄空学·宅斷》阳宅十七条 + 阴宅五十四条原文，共 11 篇约 6.4 万字。
    题署「无锡章仲山原著，钱塘沈竹礽详注，余王后学王则先补阐」，三人均逝世逾五十年，公有领域。
    路径：新浪博客「山水清澈」2017 年逐条转录本，沿「前一篇/后一篇」链回溯抓取
    （sina 匿名只放出约 10 页文章目录，故只能沿链走；脚本 corpus/fetch/walk.py）。
    此前被 403 挡住的 360doc 那条「某姓宅屋 辛乙兼戌辰 五运所造」在本批中完整。

  检验一_跨两百年挨星回归:
    做法: 用已验证的 216 局挨星实现复算章仲山原案，与原文盘面语比对
    结果: 下卦 6/6 一致（双七到后/双七临坎/向星上山/山颠水倒/向上双七/旺星到向）
    排除: 两条替卦案，原文自书「此局用变卦」，本实现只做下卦
    含义: |
      挨星层现有四个独立端点互证：沈氏标准表 ↔ fscalc(商业2010s) ↔ Horosa(开源2020s)
      ↔ 章仲山原案(1810s-30s)。可当作已解决问题。
      但它一点也没说明风水有效——只说明同一套确定性算法被正确实现了两次。

  检验二_语料内部一致性:
    做法: 阴宅 21 案按格局分三级，与「仲山曰」后断语正负做秩相关（corpus/consistency_test.py）
    结果: |
      旺山旺向 n=4  正2 平0 负2  均值 +0.00
      双星     n=10 正3 平2 负5  均值 -0.20
      上山下水 n=7  正0 平0 负7  均值 -1.00
      Spearman rho=+0.460 p=0.036；旺山旺向 vs 上山下水 Mann-Whitney 单尾 p=0.034
    不是什么: 不是预测效度检验。作者写断语时盘已排好，一致是构造上就该发生的
    是什么: 测「即使作者可以让它对得上，它有多对得上」
    结果形状_这才是结论: |
      一头准一头不准：上山下水断语必负 7/7 无例外；旺山旺向只有一半正 2/4。
      在一个作者本可让它完美自洽的语料里，最吉的格局有一半案例记着坏结果。
    那一半怎么被解释的: |
      修正项全部是形势：「乾兑两宫有水」「山临五黄」「坎方有河冲腰」「峰歪」，
      正面案里则是「局势宏敞，水光圆朗，龙真穴的」。
      王则先说破：「玄空五行之吉凶，必与实地形峦相凑合，其验乃神……苟无路气直冲，甚验亦微。」
    推论_本项目第一个来自传统内部的支持地形层的论证: |
      按这批案例自己的记录，理气不足以解释结果，未解释的方差全被记在形势上。
      此前支持地形工作的理由要么是我们自己的假设，要么是民族志孤证（A02 前方山层数）。
      这一条不同：出自这门学问最权威的案例集，三位不同时代的注家反复确认，
      且是在理气派自己的书里、用理气派自己的失败案例说出来的。

  仍不能用来检验引擎:
    描述: 21/21 都有完整峦头描述（来龙走向、入首方位、结穴形态、各方水情）
    坐标: 只有 3/21 有可定位地名（柳塘桥、钱塘、青城桥），且均为村/桥级，落不到穴位
    天花板: |
      与 A06（有坐标+可计算判据+否定样本，但判据只四条）合起来：
      判据与坐标在历史文献里几乎从不同时出现。这是这条路的天花板，
      不取决于我们能找到多少材料。
    唯一例外: |
      「无锡石塘湾孙姓祖墓，子山午向，二运扦」——石塘湾为今无锡惠山区实存地名，
      是 21 案中定位精度最高者。若能找到该墓，即第一个「有原始峦头描述+有坐标」的验证点。
      但这需要地方志或田野工作，不是检索能解决的。

  三轮净变化:
    地形只在阴宅是核心: 第四次确认（清代案例集主体也是阴宅有峦头、阳宅无地形）
    产品应输出候选清单而非分数: n 由 1 增至 2（吴莲 2010s + 駱用卿十八道 1520s，相隔五百年）
    正样本标签是混合物: 三重确认（A05 + A10 + A06）
    挨星实现正确性: 四端点互证，已解决
    理气不足_余量在形势: 新增，唯一一个从传统内部支持地形层的论证
    判据与坐标从不同时出现: 明确为这条路的天花板
  仍未取得: 谈养吾《大玄空实验》

# ── v0.16：应用案例 · 上海陆家嘴与台北101（2026-09-03）────────────────
# 详见 citycase/README.md，脚本与数据同目录
city_case:
  目的: 用已经过检验的那部分逻辑做一次逐层分析，不给综合分数
  输入: OSM 实测轮廓(ODbL) + NOAA IGRF 磁偏角 + Copernicus DEM N31E121/N25E121

  第一层_理气:
    可算: 元运由建成年定死（金茂/东方明珠七运，环球/上海中心/台北101 八运）
    坐向_三层问题: |
      一、数据问题——是我的失误，已补做。第一次查 OSM entrance 失败就停了，
          实际上 addr:street（门牌街道）就够用，且三栋楼都唯一确定：
          上海中心 银城中路501号 → 向 230.5°（次近候选远 2.5 倍）
          环球金融 世纪大道100号 → 向 353.5°（次近远 4.3 倍）
          台北101  信義路五段7號 → 向 180.0°（次近远 2.8 倍）
          金茂大厦 OSM 无 addr:street，仍不判。
          在此假设下出盘：上海中心坐艮上山下水、环球金融坐午双星到坐、台北101坐子双星到向。
      二、定义问题——临街面不等于玄空的「向」。各派定义不一（大门/纳气面/正立面）。
          实例：台北101 塔楼门牌「信義路五段7號」，其裙房購物中心门牌「市府路45號」，
          同一建筑体两个临街面两个门。又上海中心临街方位 255.9° 与几何法线 230.5° 差 25.4°，
          因其为扭转体、底部圆角三角形，设计上就没有正立面——
          而「向」这个概念预设了建筑有正面。
      三、对象问题——这才是真正的答案：摩天楼可能不是玄空的合法对象。
          非我推断，是语料原文自己提出的。B01《阳宅秘断》会稽章宅：
          「此屋若两家合住…一到分房宅气移，一门换作两门推」；
          王则先引《天元五歌》注：「分房者，是数家合居一屋之分房也，看法以一家私门为主…
          余屋各自立极飞布九星，谁知中宫误定，满盘都错。」
          即一屋数家各以私门立极。那么上海中心 128 层、几百家公司、入驻年各异，立几个极？
          「运」由入伙年定，取 2016 竣工年还是各租户进驻年？
          《沈氏玄空学》处理的最大单位是「一屋数家」（章宅两家）。摩天楼超出该尺度。
          这与 DEM 引擎算不了 A01 那个 2.4m 宅角退让是同一毛病的两头——尺度错配，方向相反。
      佐证: |
          C01（中银vs汇丰）通篇无人提坐向、元运、飞星盘，判据全是建筑几何；
          A04 的杜金良用相对高度与朝南，也不排盘。
          所以「找不到坐向」在实务上可能是假问题——真正给摩天楼下判断的人，
          用的本来就不是需要坐向的那套方法。
    本层唯一真发现_谁对输入精度敏感: |
      逐 0.5° 扫描找出八运真正换盘的边界共 16 条（卦界与地元/天元界；
      天元与人元同阴阳，不换盘）。
      正交对齐（0/90/180/270°）的建筑对磁偏角完全免疫——正方位落在山的正中心，
      ±7.5° 余量远大于此地 3.6-6.5° 的磁偏角。台北101 与金茂大厦即此类，真北系与磁北系同山。
      上海环球金融中心是五栋里唯一敏感的：主轴 83.5° 离换盘界 82.5° 只有 1.0°。
      轮廓数字化误差、实测差 1°、或换一种磁偏角约定，整盘就变。
    自我更正: |
      初算时以为上海中心四个候选会因磁偏角跨山（艮→寅、巽→巳等）而换盘。
      逐宫核对不成立：天元与人元在同一卦内阴阳相同，山盘向盘逐宫一致。
      跨山不等于换盘，换盘只发生在卦界与地元界。

  第二层_城市砂:
    依据: A04（杜金良：周围建筑就是山，须最高）+ C01（中银汇丰判据全是建筑几何）
    数据: OSM 半径 1200m 内有高度标注者（陆家嘴 25 座、台北 214 座）；无标注不计，是缺数据不是没建筑
    台北101: 半径 1200m 内最高，八方全部俯视，无一方被压。按 A04 的城市判据满足
    陆家嘴实测: |
      上海中心 632m 为最高；环球金融 492m 被其在 196m 外以 +35.5° 仰角压；
      金茂 420.5m 被其在 182m 外以 +49.2° 仰角压，另被环球金融以 +22.3° 压；
      东方明珠 468m 被其在 899m 外以 +10.3° 压。
      排序完全由建成先后倒过来——后建者必更高，这就是零和判断在城市开发中的表现。
      一个 2026 年的排名在下一栋楼封顶那天作废。
    限制: |
      只能算几何（高差、距离、仰角、方位）。C01 里真正被议论的「三面刀刃」「刀锋所指」
      「书本开页挡煞」判的是形态，算不出。此限制的最早例证见 A09（白虎銜尸、朱雀悲哭）。

  第三层_DEM地形:
    结果: 上海中心 0.244（高程1.2m）、金茂 0.254（6.5m）、台北101 0.421（12.4m）
    各点实测噪声: |
      不照搬黄土高原数字，噪声与地形相关。±1km 位移 SD：
      上海中心 0.023、金茂 0.028、台北101 0.055；台北101 的 ±1km 极差达 0.300。
    可以说什么: |
      上海中心 vs 金茂 Δ=0.010，远小于该地位移 SD 0.023-0.028——两数之间没有差别可言，
      两楼相距 182m，在 30m DEM 上本就是同一片地形。
      台北 vs 上海 Δ≈0.17 超过位移 SD，是真实地形差异：台北在盆地四周有山（玄武0.73藏风0.62），
      陆家嘴在长江三角洲冲积平原高程 1-7m 无山可依（金茂玄武0.39护龙0.25）。
      引擎在这一点上是对的，它确实在量真地形。
    不可以说什么: |
      台北101 自己 ±1km 内极差 0.300，比整个「台北 vs 上海」的差异还大。
      所以即便差异是真的，也不能归到这栋楼的具体位置——
      它是「台北盆地 vs 长江三角洲」的差别，不是「101 vs 金茂」的差别。
    结论: 地形层给出的唯一可靠信息是「台北在盆地、上海在平原」，看一眼地图就知道。本层不参与判断。

  没给什么_以及为什么:
    没有综合分数: 依 A08（駱用卿擇地於十八道，具圖說以進）与 A03（吴莲候选清单），
                  交付物历来是带理由的候选清单不是一个数；且 C03「能量值 36000 分」是引以为戒的反面标本
    没有吉凶判语: 三层里唯一确定的只有元运；坐向未定则盘未定，盘未定说吉凶就是在编
    没有排名: 城市判断零和相对（A04），排序随新楼落成而变

# ── v0.17：条件混用问题的梳理与分层实测（2026-09-03）─────────────────
# 详见 layering/README.md、layering/stratify_results.md
condition_mixing_audit:
  起因: 用户批评——计算逻辑对不同场景条件混用；分析建筑前应先判断是地理位置还是室内、
        是现代还是古代；唐代建筑不能用明代书籍作参考。该批评成立且比自查发现的更根本。

  实测一_对象混用:
    事实: |
      全部 16 条规则出处逐条核对：葬经翼(明·缪希雍)8 条、博山篇 4 条、雪心赋 2 条、
      葬经 4 条(含五不葬)、清代遵化相度 1 条、无出处「通行口诀」1 条。
      **一本阳宅书都没有，全部是阴宅文献。**
      而验证样本 4356 处：墓+陵 457 = 10.5%，其余 89.5% 是寺塔城桥窑府署，
      含 22 座厂、6 座矿、13 座站等近现代工业遗产。
    此前判断: 这是效应量低的主因
    实测结论: '**被推翻**，见实测三'

  实测二_数据年代性:
    事实: |
      洛阳盆地五座都邑（皆确凿傍洛河而建）用现代 DEM 水系实测：
      二里头(前1750) 距水 2427m 汇水 0.0km²
      偃师商城(前1600) 2562m 0.0km²
      东周王城(前770) 2648m 0.0km²
      汉魏洛阳故城(25) 493m 2.7km²
      隋唐洛阳城(605) 309m 2.3km²
      前三座匹配到的不是洛河，是提取出的小沟——洛河改道了。
    含义: |
      平原模式下 water+water_gate = 0.48，近一半权重落在已失真的量上。
      此前只想到「文献时代 vs 遗址时代」，没想到「数据时代 vs 遗址时代」——
      DEM 是 2010 年代的，遗址是公元前的。
    复现: layering/water_anachronism.py

  实测三_自己的假设被推翻:
    假设: 若对象混用是主因，分层后阴宅层（规则的对象匹配层）效应应显著高于其余层
    结果: |
      宗教(寺庙观塔祠) n=258 效应+0.026 增益+0.386 p<0.001  ← 最强
      阴宅(墓陵)       n=72  效应+0.004 增益+0.040 p=0.476  ← 几乎为零
      阳宅             n=20  效应-0.089 增益-inf   p=1.000
      **对象匹配层效应几乎为零，不匹配层最强。方向与预期相反。**
    排除的混淆: |
      怀疑宗教层效应来自「塔」（塔建高处，可能只是选高地的普通地理规律）。
      拆开：庙 n=85 效应+0.062、寺 n=119 +0.015、塔 n=28 **-0.005**。
      塔的均分反而低于背景。效应来自庙与寺，不是塔。该怀疑不成立。
    更关键的: |
      按区再分，同一层在三区符号互相矛盾：
      京津冀阴宅 +0.467 / 关中阴宅 -4.400 / 晋南豫北阴宅 -0.233
      京津冀宗教 -0.018 / 关中宗教 +0.133 / 晋南豫北宗教 +0.365
      **对象分层没有消除洛阳/关中矛盾，矛盾在层内原样存在。**
    复现: layering/stratify.py

  十一条轴:
    轴1_对象层: 阴宅/阳宅/聚落城址/寺观/工业，规则不可互换。已实测，非主因
    轴2_时代层: 文献成书年代/遗址营建年代/数据采集年代，三个子层
    轴3_流派层: 形势 vs 理气；理气内部三合三元玄空八宅互相矛盾
    轴4_尺度层: 穴1.3m/宅10m/院30m/聚落100m/城1km/势10km
    轴5_语式层: 判定式(「有水」)vs 祈使式(「宜见水」)，数学方向相反。
                我批评过 suangua 混这个，但没回头查自己——R6_deshui、R7_shuikou 原文是择址指引，
                被我实现成了判定
    轴6_主体层: 立极单位。B01 会稽章宅「一到分房宅气移」「余屋各自立极」
    轴7_时间性层: 本盘静 vs 流年动；以及地貌水系千年变迁（实测二）。
                  郭璞葬母案「其后沙涨…皆为桑田」原文就在讲河道演变，而我把地形当静态
    轴8_参照系层: 真北/磁北、符号约定、坐标系。已处理干净（audit/geo）。
                  残留：guobao.json 坐标可能是 GCJ-02，偏移 300-600m 正落在噪声敏感区，须核
    轴9_因果方向层: 坐向是输入不是输出。已发现，尚未改
    轴10_检验口径层: 排序 vs 召回。已发现，尚未改
    轴11_地域层: |
      **本次实测新增，可能比对象层更重要。**
      形势派诸经出自江西福建江浙一系（缪希雍江苏常熟人）。
      关中阴宅层增益 -4.400 为全部分层最极端负结果；关中阴宅主体是汉唐帝陵，
      「因山为陵」「积土为陵」，受昭穆制度与都城方位约束，位于渭北黄土台塬。
      把江南丘陵总结的判据用于黄土台塬——此前只写在「盲区」里，现已证实。

  影响评级:
    未被动摇: 天花板 ±100m SD=0.024、挨星四端点互证、磁偏角量化、
              「理气不足余量在形势」（该结论出自阴宅案例集，对象一致无混用）
    适用条件被收窄: 效应量 +0.043 是「混合样本 + 失真水系」条件下的下界
    解释被改写: |
      洛阳/关中矛盾——「对象构成不同」的解释已被实测否定，
      当前最可能是地域层。撤回洛阳继续有效。
    合计增益的性质: |
      不分层时合计增益 +0.136 看似「弱但正向」，实际是三个方向相反的层平均出来的。
      分层实测把一个看似有说服力的假设证伪了，这正是分层该做的事。

  要建的_前置判定层:
    四问: 对象类型 / 营建年代 / 立极单位 / 分析目的（择址 vs 断验）
    规则筛选: 对象、年代、尺度、语式四项皆匹配才参与计算——不参与，不是降权
    输出契约: 必须给出四问答案、参与规则清单、被排除者及理由、数据可靠性告警、每条中间量
    禁止: 四问有「未知」时输出综合分数；输出无中间量的裸数字
    设计: layering/dispatch.yaml；古籍分类表 layering/sources.yaml

  最该先做的:
    1: 给 guobao.json 补年代与对象类型字段（无此则轴1轴2都无法执行）
    2: 按地貌大区分层重算（轴 11 是当前最强嫌疑）
    3: 对早期遗址关闭 water/water_gate，看效应量变化
    4: 从《阳宅十书》(已入库 gjtsjc/675-678)抽阳宅规则；
       从《管氏地理指蒙》(gjtsjc/655-659)抽城址规则；
       从《水龙经》(gjtsjc/671-674)抽平洋规则——平原样本本应用这一支

# ── v0.18：分层实测续 —— 用官方名录重做轴 1/轴 2，并消融水分量（2026-09-03）──
stratify_round2:
  数据源选择:
    Wikidata: 类别 73% 但其中 2392 条是「文物保护单位」这种无用值；年代仅 5%。基本没用
    维基百科官方名录: 第 N 批全国重点文物保护单位，编号第三段即官方类别码，另有时代列。
                     类别 100%、时代 98%。抓 8 批共 3155 处（第七批页面结构不同返回 0）
    并入匹配率: 只有 46%（繁简、括注、别名差异）。round2 的 367 正样本匹配到 167

  轴1_对象_确证:
    结果: |
      石窟寺及石刻 n=8  增益 +0.680 p=0.010
      古遗址       n=10 +0.333 p=0.322
      古建筑       n=118 +0.285 p=0.023
      古墓葬       n=24  **-0.200** p=0.736  ← 四类里唯一为负
    含义: |
      本项目 16 条规则全部出自墓葬文献，而它在墓葬上表现最差。
      按名称分类与按官方编号分类两次独立得到同一结论。这一条现在是稳的。

  轴2_时代_测不了:
    结果: 隋唐 +0.367、明 +0.350、元 +0.300、宋辽金 +0.273、清 -0.150，均不显著，无朝代梯度
    关键限制: |
      史前、商周、秦汉三层全部不足 n=8 而落选，而「水系失真惩罚古老遗址」恰要靠这三层检验。
      原因是关中匹配率仅 36%（22/61），而关中正是早期遗址集中的区。
    区的年代构成: 关中唐/西汉/秦为主；晋南豫北金宋明元清；京津冀清辽明。
                  与假设一致，但样本太薄，构不成检验

  轴7_水系消融_部分支持:
    口径: |
      round2 的 faults 字段只存凶格名称不存折减值，无法忠实重建最终分
      （重建 vs 存储 corr=0.84，平均绝对差 0.036）。
      故一律用不含凶格折减的基础分，两条件口径一致，但与 results/ 存储分不可直接对照。
    结果: |
      京津冀  含水 -0.262 → 去水 -0.093
      关中    含水 -0.356 → 去水 -0.109
      晋南豫北 含水 +0.360 → 去水 +0.300
      两个负区明显改善，唯一正区变差，方向与「水系失真」一致。
    但两点必须说清: |
      ① 关中去水后仍为负(-0.109)，水系失真不是它为负的全部原因
      ② 三区都向零收缩，也可能只说明水分量整体噪声大，而非特指古代遗址的水系代理失真。
         要分开这两种解释需按年代分层做同样消融——而年代分层样本不足，做不了。

  本轮累计:
    轴1对象: 确证——规则在墓葬上表现最差（两种独立分类法一致）
    轴2时代: 测不了——早期层样本不足
    轴7水系: 部分支持——两负区改善但关中仍负，无法与「水分量噪声大」区分
    轴11地貌版: 已排除（v0.17 续）
    起伏混杂: 已排除（v0.17 续）
    结论: 「区」的效应至今没有被任何一个已检验的变量解释掉

  下一步最直接的:
    提高名录匹配率（繁简转换、模糊匹配），46% → 七成上下，
    以取得足够的早期遗址样本，才能真正检验轴 2 与轴 7

# ── v0.19：规则逐条核对原始文本（2026-09-03）────────────────────────
# 详见 rules_audit/README.md，脚本 rules_audit/quote_check.py
rules_audit:
  为什么现在才做: |
    当初抽规则用的是二手来源（youngzs/xuanxue 仓库的 docs/）。
    现在《古今图书集成·堪舆部》30 卷已入库，卷 666 是黃妙應博山篇全文、
    卷 670 是繆希雍葬經翼全文——16 条规则里有 13 条出自这两部。第一次可以拿原文逐字核。

  语料里到底有哪些书: |
    有全文：青囊海角經、青烏先生葬經、管氏地理指蒙、楊筠松十二杖法、
            黃妙應博山篇(卷666)、繆希雍葬經翼(卷670)、水龍經、陽宅十書
    没有：《雪心賦》——卷 666/669/673/679 只提书名或转引片段。
          故 R7_shuikou_guansuo 与 F5_fantiao 无法核对，不是引文有问题。

  方法标定_必须先做: |
    quote_check.py 用「最长公共子序列/引文长度」比对，该指标有噪声底。
    阴性对照（四句伪造的风格相似句）得分 0.38-0.47——35 万字语料里
    任何常用字组合都能凑出子序列。
    判读：≥0.85 且能定位到具体卷=属实；0.5-0.85=不足为凭；<0.5=与伪造句同级。
    对十余字的短引文两个方向都不可靠（既虚高也虚低），只能用来筛，不能用来判。

  确认的缺陷:
    高_balance无文本依据: |
      R2 的 near_hu 里有 .35*(1-|L_rise-R_rise|/max(...))，即左右对称项。
      原文（卷670 四獸砂水篇）对龙虎的要求是「環抱有情，不逼不壓，不折不竄」，
      并「青龍蜿蜒，白虎馴頫」——给左右规定了不同形态，没有一条要求对称。
      该项占 hulong 的 24.5%（0.35×0.70），而 hulong 参与全部验证——
      此前所有增益数字里都掺着这一项。
      处理：标 source:无，与其余分项分开报告，不计入总分。
    高_明堂无水项: |
      原文（卷670 明堂篇）：「明堂者，穴前水聚處也」，且给出明确四级序
      「以聚水為上，橫抱次之，朝水又次之，交互有情不見水去而順流者又次之」。
      而实现的 inner/outer 六个分项全是地形（坡度、落差、开阔度、案山仰角、朝山仰角），
      没有一项是水。mingtang 权重 0.18/0.22，是第二或第三大分量。
      引擎另有 water 分量含 bank(凹凸岸，近似横抱)，但「聚水」无对应量，四级序完全没实现，
      且水与明堂被拆成两个独立分量相加，而原文里是同一件事的两面。
    中_穴病十五条实现七条: |
      《穴病篇》十五条：貫頂、折臂、破面、墜足、綳面、飽肚、割腳、漏腮、虎蹲、龍踞、
      元武拒尸、朱雀騰去、前花、後假、左右詭落。
      已实现七条（拒尸F1、墜足F2、折臂F3、割腳F4、破面F6、虎蹲+龍踞F7）。
      可算而未实现两条：貫頂（背后无独立局部高点，用 R1 已有的 backing 几乎零成本）、
      朱雀騰去（与 F5 反跳相关但不同，還要求「朝斜背」，应与 R3 的 facing_ratio 联用）。
      其余六条属穴场微地形或需人辨真假穴，30m DEM 算不了。
    低_F7命名不当: F7_gaoya 的内容是虎蹲+龙踞，「高压」并非穴病名。应改名 F7_hudun_longju
    次_R3距离带: 原文「不拘遠近」，而实现限定 0.3-2km 环带，与原文矛盾
    次_R7对象条件: |
      原文（卷670 水口篇）「若結都會及作帝王山陵，必有北辰尊星坐鎮水口」——
      都城与帝陵另有加码条件。现行 R7 只算谷宽比且不分对象。
      这条同时印证了 layering 的轴 1（对象层）不是我强加的分类，是原文自带的。
    次_M明堂两层出处应改: |
      标的是「清代遵化九凤朝阳峪万年吉地相度记载」，
      但中明堂/外洋大明堂的划分就在《葬经翼·明堂篇》里，早四百年。清代档案是旁证不是出处。

  我在审计里判错又改回的: |
    初稿写「F7 不在穴病篇十五条之列，出处标注不准」，并把虎蹲龙踞列入「可算而未实现」。
    机械核对后发现写错了：F7 的 quote 是「虎蹲者，形反而凶僭且逼也；龙踞者，势凌而压强且窜也」，
    逐字出自原文，两条已经实现。错的只是 id 取名。
    错因：只按 id 名去原文里搜「高压」，没搜 quote 字段。
    教训：核对要以 quote 为准不能以 id 为准——id 是我起的名字，quote 才是证据。

  总账:
    我加的原文没有的: balance（左右对称）—— 最危险的一类，凭空添加的项会主动制造信号
    原文有而漏实现的: 明堂的水含四级序、貫頂、朱雀騰去、R7 的对象条件
    命名不当: F7_gaoya → F7_hudun_longju
    无法核对: R7、F5（《雪心賦》不在语料）
    审计自身判错又改回: F7 的出处与实现状态
  教训: |
    从二手整理稿抽规则，与从原文抽规则，不是同一件事。
    在拿到原文之前，rules_luantou.yaml 里每条 source 字段给人的「可回溯」印象是虚的——
    能回溯到的只是别人的整理稿。

# ── v0.20：规则改动落地 + 典型建筑验证 + 文献编年（2026-09-03）──────────
# 三处规则改动落地为引擎 v0.7，并在八个典型建筑上做对照验证；
# 全部文献按可考年代排序，形成编年（typical/CHRONOLOGY.md）与
# 分级结论（typical/MODERN_RULES.md）。
v07_rule_fixes:
  依据: rules_audit/README.md 的三条「确认的缺陷」，逐条按原文改
  改动:
    删_balance:
      原实现: near_hu 中 .35*(1-|L_rise-R_rise|/max(...))，占 hulong 的 24.5%
      原文: 「青龍蜿蜒，白虎馴頫」——给左右规定了不同形态；全文无一处要求对称
      处理: 删除；剩余两项权重由 .40/.25 归一为 .60/.40
      注意: 此前所有增益数字里都掺过这一项，旧数不能与新数直接比
    补_明堂水项:
      原文: 「明堂者，穴前水聚處也」；「以聚水為上，橫抱次之，朝水又次之，……順流者又次之」
      实现: _mingtang_water()，向=坐+180，前方 ±45°、80m–1500m 扇区内取水系
      分级: 聚水 1.00 / 横抱 0.75 / 朝水 0.50 / 顺流 0.25 / 无水 0.00
      权重: mingtang = .35*水 + .65*地形
      关键约束: |
        坐向未知则该项返回 None，由 score() 把它排除并对地形项重新归一。
        不是给 0 分。理由：向若是从地形反推来的，「穴前」就没有独立信息，
        此时判「无水」只是把「没检测到」冒充「没有」——这正是我在
        audit/ 里批评 suangua 的同一类错误。
      自查记录: |
        初版没有这个约束，直接把「无水」记 0.0 并以 0.35 权重入总分。
        实测 78% 的点被判「无水」；进一步量到「最近水系方位 vs 反推的向」
        相差 71–77°，即扇区几乎总是落空。改为不判。
    放宽_R3环带:
      原实现: 0.3–3 km
      原文: 「不拘遠近，俱名有情」——明言距离不论
      处理: 放宽为 0.1–4 km

fault_registry_reconcile:
  说明: 把本文件登记的凶格与引擎实际代码逐条对齐（此前两边对不上而未记）
  对齐结果:
    F1_juzhi: 已实现，代码名「拒尸(玄武不垂)」
    F2_zhuizu: 已实现，代码名「断山(坠足)」
    F3_zhebi: 已实现，代码名「折臂」
    F4_gejiao: 已实现，代码名「割脚」
    F5_fantiao: |
      已实现，代码名「朱雀腾去」——触发条件是 bank<0（凸岸）且 d_water<800
      且 sinuosity 超阈，正是「反跳」的机制。登记名与代码名不同，此前误记为未实现。
    F6_pomian: |
      **登记了但没有接入。** M["tri"] 确实在算（穴周 300m 高程标准差），
      但只被地貌分类用（tri > 0.055*relief_3km → 「破碎沟壑」），
      从未作为凶格扣分。
      未接入的真实原因：登记的触发条件是「处于区域 P90 以上」，
      而 score(M) 是逐点函数，手里没有区域参考分布。
      可用的无量纲替代是 tri/relief——但那个统计量已经被地貌分类消费，
      再拿它做凶格就是同一个量记两次。故维持不接入，列入待办而不是硬凑。
    F7_gaoya: 已实现两条，代码名「虎蹲(衔尸)」「龙踞(嫉主)」；id 仍待改名
    F_过山: 已实现，仅 mountain 模式
    F_独山: 已实现，仅 mountain 模式
  订正: |
    rules_audit 里写「已实现七条（……破面F6……）」有误，破面并未接入。
    同处写「朱雀騰去可算而未实现」也有误，v0.6 起就有。
    两处都是按 id/名称去代码里搜而没有核对触发条件所致——
    与之前那次「按 id 而非 quote 去原文里搜」是同一种错法。

typical_validation:
  样本: typical/sites.yaml —— 八个坐向有据可查的点，逐点注明坐向出处
  方法: |
    同一坐向、同一 DEM、同一半径，v0.6 与 v0.7 并排跑（typical/run.py），
    再给每点算本地背景分位（typical/bg.py，半径 15 km 内 400 随机点、同一坐向）。
    单点分数不能孤读——0.30 在平原可能是高分，在山地是低分。
  预注册: |
    只有一条是跑之前写进 sites.yaml 的：T5 北宋永定陵「预期得低分，且这是正确的
    ——它本就不按形势派定向」。
    **按原始分兑现（0.468 < 长陵 0.596），按本地背景分位不兑现**：
    永定陵在自己 15 km 邻域里排 77 分位、z=+0.95，模型并没有把它判成差地方。
    0.468 之所以显得低，是巩义一带整体地形不如燕山——是区域基线差别。
    结论：本轮唯一一次预注册检验，结果是**不支持**。
    其余各点的高低是跑完才看到的，不算预测，只能算描述。
  预注册这条的教训: |
    原始分的高低会被区域基线整个带走。拿原始分去验证「规则与择址范式不匹配」
    是不成立的推理——要检验那个命题，得比较同一区域内按五音姓利定向
    与按形势定向的点，本样本里没有这样的对照。
    我在写 VALIDATION.md 第一稿时就是按原始分读的，被自己下一步的数据推翻。
  结果: 见 typical/VALIDATION.md

term_chronology:
  脚本: typical/term_trace.py
  语料: masters/corpus/gjtsjc/ 651-680（1726 殿本，30 卷）
  计数:
    明堂: 313
    生氣: 197
    龍虎: 134
    水口: 109
    四勢: 101
    平洋: 62
    陽宅: 43
    得水: 38
    五音: 31
    藏風: 29
    三元: 19
    納甲: 14
    飛星: 0
    挨星: 0
    九運: 0
  结论: |
    「坐向度数 → 挨星起星 → 山盘向盘双飞 → 二十四山分阴阳顺逆」这套排盘术
    在 1726 年官修类书三十卷里一个字都没有。该书收书二十余种，连符镇、择日、
    以及整卷反对风水的文章（卷 680 藝文）都收，收录标准不是「只收认可的」。
    故：用玄空飞星评 1726 年以前的建筑是倒推。
  必须带的限定: |
    「三元」19 次不是零。逐条核过是三类，都不是玄空飞星：
    ① 三元甲子配福元——《陽宅十書》675/677「三元甲子福德」；
       《管氏指蒙》660「一白……九紫，分三元、六甲。上元甲子生人，一十起三碧……
       不問上中下三元皆順行九宮」。输入是人的生年，九星顺行九宫，不排山盘向盘。
    ② 书名——651《三元宅經》《三元經》，680《三元衡鑑》《五音三元宅經》。
    ③ 《水龍經》672 引作配套：「當合《三元九宮》推之」。
    第③条说明 1726 年前确实存在《三元九宮》其书。
    所以这条实证到「飛星/挨星/九運 三词全零」为止，
    **不能扩大成「三元系统整个是清代才有的」。**
  为什么单列: |
    这是本项目少数几条「拿语料计数直接证到」的结论之一，
    此前只是判断。单列以便日后被更早的语料推翻时能定位到具体计数。

local_background_percentile:
  脚本: typical/bg.py
  方法: 每点在同瓦片、半径 15 km 内取 400 随机点，**沿用该点的坐向**，算经验分位
  为什么必须做: 0.30 在陆家嘴和在燕山不是一回事；单点分数孤读无意义
  结果:
    明十三陵长陵: {分位: 97%, z: +1.85, 背景SD: 0.130}
    上海中心大厦: {分位: 98%, z: +1.43, 背景SD: 0.021}
    北宋永定陵:   {分位: 77%, z: +0.95, 背景SD: 0.136}
    汉魏洛阳故城: {分位: 58%, z: +0.10, 背景SD: 0.084}
    台北101:      {分位: 58%, z: -0.04, 背景SD: 0.124}
    隋唐洛阳城:   {分位: 41%, z: -0.25, 背景SD: 0.087}
    上海环球金融中心: {分位: 36%, z: -0.10, 背景SD: 0.021}
    二里头:       {分位: 27%, z: -0.68, 背景SD: 0.088}
  检验: |
    八点都是已知被选中的地方。若模型有效度，应系统性高于自己的邻域。
    高于本地中位 5/8，二项单侧 p=0.363；分位均值 0.615，t 单侧 p=0.134；
    Wilcoxon 单侧 p=0.219。剔除背景近乎无方差的两个上海点后 4/6，p=0.344。
    **全不显著。** n=8 本来也检不出什么——列出来是为了不让「5/8 高于中位」被当成支持。
  三条要单独说的:
    上海中心的98分位是假的: |
      背景 SD 仅 0.021，整个 15 km 邻域挤在 0.24 附近——陆家嘴在 30m DEM 里是一块平板。
      在近乎退化的分布上 0.03 的差就能推到 98 分位。
      长陵 97%（SD 0.130）与上海中心 98%（SD 0.021）数值几乎相同，证据价值完全不同。
      **新增记账规则：分位必须与背景离散度一起报，单报分位会把噪声读成信号。**
    二里头27分位: |
      比周围 73% 的随机点还低。一个延续数百年的真实都邑。
      坐向无据故水项不判，这个 27% 完全由地形项给出。
      **本轮唯一方向明确为负的结果，不绕过。**
    永定陵推翻了预注册的读法: 见 typical_validation.预注册
  城址逐点判据不成立: |
    隋唐洛阳城跨洛河而建。取定鼎门一带（城南）则洛河在背后、与向差 142°，判「无水」；
    取城北则相反。**取点决定结论**——不是精度问题，是判据用错了对象。
    《葬经翼·水口篇》原文自己就把「都會」与「帝王山陵」单列（见 MODERN_RULES B6），
    对象层是原文自带的，不是我强加的。
    **影响面**：本项目此前所有城址单点分都受这条影响。
    上一轮洛阳 +0.564 与关中 -1.400 的矛盾，很可能有一部分就出在这里——
    城址样本占比高，而城址用逐点判据本来就不成立。
  明堂扇区阈值敏感性:
    脚本: typical/sector_sweep.py
    结果: |
      半角 20°-90° 扫描，七个有坐向的点里两点翻档：
      汉魏洛阳城在 40°→45° 之间翻（其唯一入选水系点角差 43°，卡在分界上），
      长陵在 30°→40° 之间翻（顺流→横抱）。其余五点全程不动。
      **「聚水」这一档八点一次都没触发**——四级序里最高的一级从未被观测到，
      等于没验证过。
    处理: ±45° 无原文依据（原文只说「穴前」）。该项应连角差一并报告，不能只给二值判定。

# ── v0.21：平洋法落地，并因此查出汇流网络的 bug（2026-09-04）─────────────
drainage_bug:
  级别: 高 —— 这是本项目至今查出的影响最大的单个缺陷
  怎么发现的: |
    实现《水龙经》平洋法的第一条「支干相扶」时，八个典型点里五个报「俱无」，
    包括紧邻洛河的汉魏洛阳故城与隋唐洛阳城。查下去发现洛阳一带 4 km 内
    最大汇水面积只有 4.35 km²，而洛河实际流域上万 km²。
    3×3 瓦片区（89,530 km²）内最大流域仅 195 km²，占区域面积 0.22%。
  病因: |
    Region._drainage() 里，填洼用形态学重建会造出**严格水平的平面**；
    随后 D8 定向写的是 `upd = drop > best`，best 初值 0，即要求严格正落差。
    平面上八邻域落差全为 0，方向保持 -1，汇流在此中断。
    实测单瓦片 6.39% 的内部格无下游，其中 100% 是「邻域最低高程等于自身」的严格平地。
    平原正是平地最多的地方，所以这个缺陷恰好在最需要水系的地方最严重。
  改法: |
    Garbrecht & Martz (1997) 双梯度平地导流：平地上叠极小合成坡降
    （背离高地 + 趋向出口，出口权重 2 倍，ε=1e-3 m/步），在 fill+ε·梯度 上重排 D8；
    残余平手格再做一次多源 BFS 兜底（步数严格递减，不成环）。
  外部校核:
    脚本: typical/river_check.py
    参照: OSM waterway=river（独立于 DEM，非本项目产物）
    洛阳盆地_平原: {n: 391, 中位距离_修前: 2121m, 修后: 304m, 小于240m占比_修前: 9.0%, 修后: 45.3%}
    燕山南麓_山地: {n: 1185, 中位距离_修前: 1106m, 修后: 212m, 小于240m占比_修前: 23.8%, 修后: 52.0%}
    要点: |
      两区都大幅改善，且修前平原确实比山地差一倍（2121 vs 1106 m），
      与「平地导流失效」的病因判断一致。
      「变了」不等于「对了」——所以必须用外部数据校，不能只看分数动没动。
  影响面: |
    d_water、bank、sinuosity、lock、river_km2、dh_water、water_converge、mt_water
    ——引擎里所有涉水的量，此前都算在一张平均偏离真实河道 1-2 km 的网上。
  bug与规则的影响之比:
    脚本: typical/drainage_effect.py（同一套 v0.6 规则跑在修前/修后网络上）
    平均绝对变化: {修bug: 0.059, 改规则: 0.025}
    结论: 一个 bug 的影响是四条规则改动加起来的 2.4 倍
  必须撤回的: |
    此前所有涉水结论的**数值**一律作废，要重跑：
    洛阳 +0.564、关中 -1.400、三区分层效应 +0.043、水分量消融实验、
    以及 v0.20 刚做的八点本地背景分位（已用 v0.8 重算）。
    结论的**方向**未必错，但数值不能再引用。
  教训: |
    这个 bug 在库里至少存在了从 v0.1 到 v0.7 的全过程，
    期间做过五点验证、三区分层、尺度扫描、噪声测量、消融实验——
    没有一项检出它，因为每一项都只比较模型自己的输出。
    **只有把中间产物（水系位置）对着外部数据看，才发现得了。**
    今后凡是引擎算出的地理要素（水系、山脊、谷宽），
    都要有一次对外部数据的位置校核，不能只验分数。

b7_pingyang:
  出处: 《欽定古今圖書集成》卷 671-674《水龍經》（已在库 masters/corpus/gjtsjc/）
  为什么必须补: |
    此前 16 条规则全部出自山龙一系，而《水龙经》序开宗明义：
    「後世言地，知山之龍而不知水之龍，遂使平洋水局之地，傅會山龍之妄說」
    ——拿山龙判据评平原，原文自己就点名说是错的。
    而洛阳盆地、关中、陆家嘴都是平原样本。
  四项:
    支幹相扶:
      quote: 以通流大水為行龍而為幹，溝渠小水為割界而為支。穴法取支不取幹
      quote2: 大江大河，雖有灣抱，其氣曠渺，與墓宅不親，斷難下手。須於其旁另有支水，作元辰繞抱成胎
      实现: 4km 内最大汇水为干，1km 内小汇水为支
      分级: {支幹相扶: 1.00, 有幹無支: 0.40, 有支無幹: 0.40, 俱無: 0.00}
      为什么两者同值: |
        原文「小幹無支，其局雖大，必久而後發；支龍無幹，其效雖捷，而氣盡易衰」
        ——只说两者皆不若支干相扶，**没有把这两者互相排序**。故给同值，不臆造高下。
    干水回頭環繞:
      quote: 大江大河一二十里而來，不見回頭環繞，中間雖有屈曲，決不結穴，直至環轉回顧之處，方是龍脈止聚
      实现: 干水在 24 个方位扇区中的占据比例
    屈曲:
      quote: 水法不拘去與來，但要屈曲去復迴，三回五度轉顧穴，悠悠眷戀不忍別
      实现: 沿河道上下游各 1.2km，数转向反复次数
    澄清停蓄:
      quote: 澄清停蓄甚為佳，傾瀉急流有何益
      实现: 河道纵比降
  权重: {支干: .40, 屈曲: .25, 環繞: .20, 停蓄: .15}
  权重的出处状态: |
    只有「支干排第一」有原文依据——「余以支幹之說，為水龍第一義」。
    其余三项之间的比例是估值，标为估值，不冒充有据。
  势形在平洋的对应物:
    quote: 以幹龍繞抱，取外氣形局；以支龍正息交會，取內氣孕育
    说明: 干即势（外气），支即形（内气）。这不是类比，是卷 671 總論一的原话。
    实现: 平洋模式下 shi 用 py_gan、xing 用 py_zhi，不再拿玄武充势、拿贴身龙虎充形
  平洋权重重排:
    quote: 行到平洋莫問蹤，只看水繞是真龍
    quote2: 平陽大地無龍虎，漭漭歸何處？東西只取水為龍
    处理: 平洋模式下 xuanwu 与 hulong 归零，其 0.14 全给 pingyang
    保留藏风: 《水龙经》未论藏风，不能借它的名义删《葬经》的条目，故保留 0.03
  新增凶格_干水散气:
    quote: 幹水斜行，似有曲折，而非環抱，又無支水，以作內氣，總不結穴
    source: 卷671 幹水散氣圖說
    实现: 三条件同时成立（有幹無支 且 wrap<0.35），罚 0.35，与五不葬同量级
    理由: 原文说的是「總不結穴」，属门槛级而非一般扣分
  会不判的情形: |
    修完 bug 之后，洛阳一带 4km 内最大汇水仍只有 20 余 km²——
    够分「支」「干」的相对高下，但远不是原文说的「大江大河」。
    故设下限：4km 内最大汇水不足成道阈值 4 倍（8 km²）即判「不判(汇流网络未见干水)」，
    score() 把该项权重按比例摊回其余各项。
    报「俱无」就是拿「没检测到」冒充「没有」——与明堂水项、与我批评 suangua 的同类。
  语料内部的一处矛盾: |
    卷 671 總論一说「水龍作用，全在八卦三元」，
    而同卷《自然水法》末句说「何用九星並八卦，生旺死絕皆虛說」。
    同一卷里对理气的态度正相反。前者是编次者（蒋大鸿一系）的话，后者是所收口诀本身。
    记此一笔：**「形势派 vs 理气派」这种二分，在原始文本里并不干净。**

sector_sweep_v08:
  说明: 明堂扇区半角敏感性，修完汇流 bug 后重做
  结果: |
    七点里**五点**在 20°-90° 内翻档（上一轮只有两点——那时水系根本没找到）。
    永定陵翻两次（30→40 无水→横抱，45→50 横抱→顺流）。
    稳定的只有长陵（全程聚水）与两个上海点（全程无水）。
  结论: ±45° 无原文依据（原文只说「穴前」），却控制着五个点的判定。该项必须连角差一起输出。
  一条兑现: |
    v0.20 记过「聚水档八个点全未触发，等于没验证过」。
    水系修对之后它出现了——长陵全程聚水。
